<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mach Zero — Arcade Combat Flight</title>
<style>
:root { color-scheme: dark; }
html, body {
  margin: 0; height: 100%; background: #000; overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none;
  font-family: 'Bahnschrift', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
}
#c {
  position: absolute; inset: 0; width: 100%; height: 100%;
  image-rendering: auto; object-fit: contain;
}
/* Action Buttons */
.btn {
  position: absolute; right: max(22px, env(safe-area-inset-right));
  border: 1px solid #8c9aa8; border-radius: 8px; color: #e5edf4;
  font: 700 10px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif; letter-spacing: .08em;
  display: flex; align-items: center; justify-content: center; text-align: center;
  z-index: 5; -webkit-tap-highlight-color: transparent; touch-action: none;
  background: linear-gradient(155deg, rgba(62,74,86,.97), rgba(13,20,29,.98) 55%, rgba(35,45,56,.98));
  box-shadow: inset 0 1px 1px #ffffff22, inset 0 -2px 3px #0009, 0 5px 14px #000b;
  transition: transform .08s, filter .12s, border-color .12s; cursor: pointer;
}
.btn::after { content:""; position:absolute; inset:4px; border:1px solid #ffffff16; border-radius:5px; pointer-events:none; }
.btn:active { transform: translateY(2px); filter:brightness(1.3); }
#gun {
  bottom: max(18px, env(safe-area-inset-bottom));
  width: 82px; height: 58px; border: 1px solid #b68b47;
  background: linear-gradient(155deg, #55452d, #171b20 58%, #34291c);
  color:#ffe0a1;
}
#gun.on { border-color:#ffb15c; filter:brightness(1.45); box-shadow:0 0 15px #b65b2b88, inset 0 1px #fff3; }
#msl {
  bottom: calc(max(18px, env(safe-area-inset-bottom)) + 70px);
  width: 72px; height: 52px; right: max(27px, env(safe-area-inset-right));
  border: 1px solid #7295ad; color:#c9e6f7; font-size:10px; line-height:1.2;
}
#msl.on { filter:brightness(1.4); }
#msl.rdy {
  border-color:#ff685b; color:#fff0ed;
  background:linear-gradient(155deg,#77352f,#24191c 58%,#4a2424);
  box-shadow:0 0 13px #d64a3b66,inset 0 1px #fff2;
}
#flare {
  bottom: calc(max(18px, env(safe-area-inset-bottom)) + 134px);
  width: 62px; height: 48px; right: max(32px, env(safe-area-inset-right));
  border: 1px solid #a58d62; color:#f0dfbd; font-size:10px; line-height:1.15;
  background:linear-gradient(155deg,#514633,#1d1c1a 58%,#393124);
}
#flare.on { border-color:#f3c57b; color:#fff2d9; filter:brightness(1.45); }
#flare.empty { opacity:.42; border-color:#777; }
#gun.hot { border-color:#d95852; color:#ffc5c0; background:linear-gradient(155deg,#66302d,#211719); box-shadow:0 0 13px #d9585266; }

/* Top HUD Quick Bar */
#top-bar {
  position: absolute; top: max(10px, env(safe-area-inset-top));
  left: max(14px, env(safe-area-inset-left));
  display: flex; gap: 8px; z-index: 6;
}
#throttle-wrap {
  position: absolute; left: max(10px, env(safe-area-inset-left)); top: 36%;
  transform: translateY(-50%); z-index: 5; width: 66px; padding: 7px 6px 6px;
  border: 1px solid rgba(145,166,190,.72); border-radius: 7px;
  background: linear-gradient(145deg, rgba(48,57,69,.96), rgba(7,13,21,.96) 52%, rgba(28,38,50,.96));
  color: #dff4ff; box-shadow: inset 0 1px 3px #aab6c333, 0 5px 16px #000b;
  pointer-events: auto; touch-action: none;
}
.throttle-head,.throttle-readout { display:flex; align-items:center; justify-content:space-between; font: bold 8px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif; letter-spacing:.08em; }
.throttle-head { color:#aebdcb; padding:0 2px 5px; }
.throttle-head b { color:#ffe19a; font-size:10px; }
#throttle-track {
  position:relative; height:140px; margin:0 3px; border:1px solid #758396;
  border-radius:5px; background:linear-gradient(90deg,#111923,#364351 48%,#111923);
  box-shadow:inset 0 0 7px #000; touch-action:none; outline:none;
}
#throttle-track:focus-visible { border-color:#7ad7ff; }
.throttle-scale { position:absolute; inset:7px 3px; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; pointer-events:none; color:#9ba9b8; font:6px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif; }
#throttle-lever { position:absolute; left:3px; right:3px; height:19px; top:50%; transform:translateY(-50%); border:1px solid #c5d0da; border-radius:3px; background:linear-gradient(180deg,#e0e7ec,#667482 45%,#293542 52%,#9ba9b5); box-shadow:0 2px 4px #000c; pointer-events:none; }
.lever-grip { position:absolute; left:4px; right:4px; top:4px; height:3px; border-radius:2px; background:#27323e; box-shadow:0 3px #d1d9df,0 6px #27323e; }
.lever-cap { position:absolute; right:-5px; top:3px; width:8px; height:11px; border-radius:2px; background:linear-gradient(90deg,#566473,#d0d8df,#596776); }
.throttle-readout { padding:6px 1px 0; color:#91a5b8; font-size:6px; }
#throttle-value { color:#ffe19a; font-size:10px; }
.hud-pill {
  background:linear-gradient(155deg,rgba(48,60,73,.94),rgba(8,14,22,.96));
  border:1px solid rgba(139,164,184,.65); color:#d7e2eb;
  font:bold 10px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif; padding:7px 11px; border-radius:4px;
  cursor:pointer; letter-spacing:.08em;
  box-shadow:inset 0 1px #ffffff1c,0 3px 9px #0009; backdrop-filter:blur(4px);
}
.hud-pill:hover { border-color:#d0ae70; color:#f1d7a4; }
.hud-pill:active { transform: scale(0.95); }

/* Virtual Joystick */
#base, #knob {
  position: absolute; border-radius: 50%; pointer-events: none; display: none; z-index: 4;
}
#base { width: 96px; height: 96px; margin: -48px; border: 2px solid rgba(140,220,255,0.4); background: rgba(20,40,70,0.2); }
#knob { width: 40px; height: 40px; margin: -20px; background: rgba(160,230,255,0.75); box-shadow: 0 0 12px rgba(120,210,255,0.6); }

/* Portrait Orientation Warning */
#rot {
  display: none; position: absolute; inset: 0; z-index: 99;
  background: #05080d; color: #ffe27a; font: bold 18px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  align-items: center; justify-content: center; text-align: center; line-height: 1.6;
}
@media (orientation: portrait) { #rot { display: flex; } }

/* Minimal monochrome menu (menu only) */
#menu {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding: 18px; overflow-y: auto;
  background: #000;
}
#menu.hidden { display: none; }
.panel {
  width:min(380px,92vw); padding:24px; color:#e3ebf1;
  background:linear-gradient(145deg,#202a34,#090e14 65%,#171f28);
  border:1px solid #647483; border-radius:8px;
  box-shadow:inset 0 1px #ffffff16,0 18px 55px #000c;
  text-align:center;
}
.title-main {
  margin: 0; color: #fff; font-size: clamp(22px, 4vw, 30px);
  font-weight: 900; letter-spacing: .18em;
}
.title-sub {
  min-height: 1em; margin: 9px 0 16px;
  color: #ccc; font-size: 10px; letter-spacing: .08em;
}
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mbtn {
  min-height:42px; padding:10px 12px; color:#dce6ed;
  background:linear-gradient(155deg,#354351,#151d26 60%,#222d38);
  border:1px solid #667989; border-radius:4px;
  font:bold 11px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif; letter-spacing:.1em;
  cursor:pointer; box-shadow:inset 0 1px #ffffff18,0 2px 6px #0008;
  transition:filter .12s,border-color .12s,color .12s;
}
.mbtn:hover,.mbtn:focus-visible { color:#f3dcae; border-color:#c4a36b; filter:brightness(1.15); outline:none; }
.mbtn:active { transform:translateY(1px); filter:brightness(1.3); }
.mbtn.primary { grid-column:1/-1; border-color:#c2a36f; color:#ffe3b0; font-size:13px; letter-spacing:.18em; background:linear-gradient(155deg,#55452e,#20242a 60%,#3a3022); }
.controls-panel { text-align: left; }
.control-list { margin: 0 0 16px; border-top: 1px solid #555; }
.control-row {
  display: grid; grid-template-columns: 76px 1fr; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid #555;
  font-size: 11px; line-height: 1.35;
}
.control-row span { color: #aaa; }
.control-row b { color: #fff; font-weight: 700; text-align: right; }
.controls-panel .mbtn { width: 100%; }
#menu [hidden] { display: none !important; }
@media (max-width: 420px) {
  .panel { padding: 20px 16px; }
  .control-row { grid-template-columns: 66px 1fr; font-size: 10px; }
}


/* Restrained field-green controls: flat color, hard edges, no decorative gradients */
.btn {
  border: 1px solid #405b45;
  border-radius: 0;
  color: #e4e8df;
  font: 700 10px 'Bahnschrift', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  letter-spacing: .08em;
  background: #263b2d;
  box-shadow: inset 0 1px rgba(255,255,255,.08), 0 2px 5px rgba(0,0,0,.55);
}
.btn::after { border: 1px solid rgba(225,235,220,.10); border-radius: 0; }
.btn:active { transform: translateY(2px); filter: brightness(1.18); }
#gun, #msl, #flare {
  background: #263b2d;
  border-color: #405b45;
  color: #e4e8df;
}
#gun.on, #msl.on, #flare.on {
  background: #263b2d;
  border-color: #71866d;
  color: #f0f2e9;
  box-shadow: inset 0 0 0 1px rgba(225,235,220,.10), 0 0 7px rgba(45,75,49,.35);
}
#msl.rdy, #gun.hot {
  background: #263b2d;
  border-color: #71866d;
  color: #f0f2e9;
  box-shadow: inset 0 0 0 1px rgba(225,235,220,.10);
}
#flare.empty { opacity: .42; border-color: #405b45; }

/* Menu only */
#menu { background: #000; }
.panel {
  color: #e4e8df;
  background: #263b2d;
  border: 1px solid #405b45;
  border-radius: 0;
  box-shadow: 0 8px 24px rgba(0,0,0,.65);
  text-align: center;
}
.title-main { color: #edf0e8; }
.panel.result-panel .title-main {
  font-size: 12px;
  letter-spacing: .28em;
  color: #b9c5b4;
}
.panel.result-panel .title-sub {
  min-height: 1.1em;
  margin: 8px 0 25px;
  color: #f4f5ef;
  font-size: clamp(34px, 8vw, 48px);
  font-weight: 800;
  letter-spacing: .04em;
  line-height: 1.05;
}
.mbtn {
  min-height: 42px;
  padding: 10px 12px;
  color: #e4e8df;
  background: #263b2d;
  border: 1px solid #506b54;
  border-radius: 0;
  font: 700 11px 'Bahnschrift', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  letter-spacing: .1em;
  cursor: pointer;
  box-shadow: none;
  transition: background-color .12s, border-color .12s, color .12s;
}
.mbtn:hover, .mbtn:focus-visible {
  color: #fff;
  background: #304936;
  border-color: #849681;
  outline: none;
}
.mbtn:active { transform: translateY(1px); background: #203227; }
.mbtn.primary {
  grid-column: 1/-1;
  background: #263b2d;
  border-color: #8a9a82;
  color: #f0f2e9;
  font-size: 13px;
  letter-spacing: .18em;
}
.control-row b { color: #edf0e8; }


/* Mach Zero field-green instrument treatment: throttle and speed HUD match the weapon controls. */
#throttle-wrap {
  width: clamp(58px, 7vw, 70px); padding: 7px 6px 6px;
  border: 1px solid #405b45; border-radius: 0;
  background: #263b2d; color: #e4e8df;
  box-shadow: inset 0 1px rgba(255,255,255,.08), 0 2px 5px rgba(0,0,0,.55);
  backdrop-filter: none;
}
.throttle-head { color:#c2cfbd; }
.throttle-head b, #throttle-value { color:#edf0e8; }
#throttle-track {
  height: clamp(112px, 19vh, 140px); border:1px solid #71866d; border-radius:0;
  background:linear-gradient(90deg,#17251b,#304936 48%,#17251b);
  box-shadow:inset 0 0 7px #000;
}
#throttle-track:focus-visible { border-color:#b7c7ad; }
.throttle-scale { color:#b3c2ad; }
#throttle-lever {
  border:1px solid #a9b9a1; border-radius:0;
  background:linear-gradient(180deg,#d5dfce,#81947b 45%,#344a37 52%,#a7b89e);
}
.lever-grip { background:#344a37; box-shadow:0 3px #d1d9ca,0 6px #344a37; }
.lever-cap { background:linear-gradient(90deg,#526a55,#c3d0b9,#526a55); }
.hud-pill { border-color:#405b45; border-radius:0; color:#e4e8df; background:#263b2d; box-shadow:inset 0 1px rgba(255,255,255,.08),0 2px 5px rgba(0,0,0,.55); }
.hud-pill:hover { border-color:#849681; color:#fff; }
@media (max-width: 700px) {
  #top-bar { gap:5px; }
  .hud-pill { min-height:36px; padding:7px 9px; font-size:9px; }
  #throttle-wrap { top:40%; }
  #gun { right:max(14px,env(safe-area-inset-right)); bottom:max(12px,env(safe-area-inset-bottom)); width:72px; height:52px; }
  #msl { right:max(14px,env(safe-area-inset-right)); bottom:calc(max(12px,env(safe-area-inset-bottom)) + 76px); width:68px; height:48px; }
  #flare { right:max(14px,env(safe-area-inset-right)); bottom:calc(max(12px,env(safe-area-inset-bottom)) + 140px); width:58px; height:44px; }
}
@media (max-height: 420px) and (orientation: landscape) {
  #throttle-wrap { top:44%; transform:translateY(-50%) scale(.88); transform-origin:left center; }
  #top-bar { top:max(5px,env(safe-area-inset-top)); }
  #gun { right:max(14px,env(safe-area-inset-right)); bottom:max(8px,env(safe-area-inset-bottom)); width:72px; height:52px; }
  #msl { right:max(14px,env(safe-area-inset-right)); bottom:calc(max(8px,env(safe-area-inset-bottom)) + 76px); width:68px; height:48px; }
  #flare { right:max(14px,env(safe-area-inset-right)); bottom:calc(max(8px,env(safe-area-inset-bottom)) + 140px); width:58px; height:44px; }
}

/* Immersive G-LOC: the world darkens; the warning is only a clean white cue. */
#blackout-overlay {
  position:fixed; inset:0; z-index:9; display:flex; align-items:center;
  justify-content:flex-start; padding-top:0; box-sizing:border-box;
  pointer-events:none; opacity:0; visibility:hidden;
  transition:opacity .12s ease;
}
#blackout-overlay.active { opacity:1; visibility:visible; }
.blackout-title {
  position:absolute; top:41%; left:50%; transform:translate(-50%,-50%);
  width:90vw; color:#fff; text-align:center;
  font:800 clamp(16px,3.2vw,23px) "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  letter-spacing:.075em; text-shadow:0 2px 12px rgba(0,0,0,.95);
}
body.blackout-active #gun, body.blackout-active #msl, body.blackout-active #flare,
body.blackout-active #throttle-wrap { filter:grayscale(.9) brightness(.28); }
#combat-toast {
  position:absolute; left:50%; top:41%; z-index:8;
  transform:translate(-50%,-50%); width:90vw; max-width:90vw; padding:0;
  border:0; color:#fff; background:transparent;
  font:800 clamp(15px,2.9vw,21px) "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  letter-spacing:.075em; text-align:center; text-shadow:0 2px 12px rgba(0,0,0,.95);
  pointer-events:none; opacity:0; transition:opacity .12s ease; white-space:normal;
}
#combat-toast.active { opacity:1; }
body.blackout-active #combat-toast { opacity:0 !important; }
@media (max-width:700px) {
  .blackout-title, #combat-toast { font-size:clamp(15px,4vw,19px); }
}


/* Screenshot-matched Mach Zero title screen */
#menu {
  background: #263b2d;
  border: 1px solid #405b45;
  padding: 24px clamp(20px, 5.8vw, 52px);
  align-items: stretch;
  justify-content: center;
}
#menu .panel {
  width: min(760px, 100%);
  max-width: 760px;
  padding: 34px 0 26px;
  margin: auto;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  color: #e4e8df;
}
#menu .title-main {
  color: #edf0e8;
  font-family: 'Bahnschrift', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  font-size: clamp(36px, 6.8vw, 60px);
  font-weight: 900;
  line-height: 1.12;
  letter-spacing: .24em;
  white-space: nowrap;
  transform: translateY(-14px);
}
#menu .title-sub { display: none; }
#menu .panel.result-panel .title-sub { display: block; min-height: 0; margin: 10px 0 22px; color: #f0f2e9; font-size: clamp(36px, 8vw, 54px); font-weight: 800; letter-spacing: .04em; line-height: 1.05; }
#menu .panel.result-panel .menu-grid { margin-top: 24px; }
#menu .menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: clamp(56px, 9.8vh, 86px);
}
#menu .mbtn {
  min-height: 84px;
  padding: 14px 12px;
  color: #e4e8df;
  background: #263b2d;
  border: 2px solid #506b54;
  border-radius: 0;
  box-shadow: none;
  font: 800 clamp(16px, 2.45vw, 21px) 'Bahnschrift', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  letter-spacing: .095em;
}
#menu .mbtn:hover, #menu .mbtn:focus-visible {
  color: #f4f5ef;
  background: #2b4232;
  border-color: #8a9a82;
  outline: none;
}
#menu .mbtn:active { transform: translateY(1px); background: #203227; }
#menu .mbtn.primary {
  grid-column: 1 / -1;
  min-height: 84px;
  border-color: #8a9a82;
  color: #f0f2e9;
  background: #263b2d;
  font-size: clamp(17px, 2.8vw, 24px);
  letter-spacing: .18em;
}
#menu .controls-panel { text-align: left; }
#menu .controls-panel .mbtn { width: 100%; }
#menu .control-list { border-top-color: #506b54; }
#menu .control-row { border-bottom-color: #506b54; }
#menu .control-row span { color: #aebaad; }
#menu .control-row b { color: #edf0e8; }
@media (max-width: 560px) {
  #menu { padding: 14px 18px; }
  #menu .panel { padding: 22px 0 16px; }
  #menu .title-main { font-size: clamp(30px, 8vw, 42px); letter-spacing: .16em; transform: translateY(-8px); }
  #menu .menu-grid { gap: 10px; margin-top: clamp(40px, 8vh, 62px); }
  #menu .mbtn { min-height: 68px; font-size: 14px; }
  #menu .mbtn.primary { min-height: 72px; font-size: 17px; }
}
@media (max-height: 580px) and (orientation: landscape) {
  #menu { padding-top: 8px; padding-bottom: 8px; }
  #menu .panel { padding: 10px 0; }
  #menu .title-main { font-size: clamp(28px, 6vh, 42px); }
  #menu .menu-grid { margin-top: 22px; gap: 8px; }
  #menu .mbtn, #menu .mbtn.primary { min-height: 54px; }
}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="base"></div>
<div id="knob"></div>

<!-- Top-left tactical quick controls -->
<div id="top-bar">
  <button class="hud-pill" id="btn-pause" title="Shortcut: M or ESC">&#9776; MENU</button>
  <button class="hud-pill" id="btn-cam" title="Shortcut: C or V">VIEW: OUTSIDE</button>
</div>
<div id="blackout-overlay" aria-live="assertive">
  <div class="blackout-title">LOST CONSCIOUSNESS</div>
</div>
<div id="combat-toast" aria-live="polite"></div>
<div id="throttle-wrap" aria-label="Jet engine throttle quadrant">
  <div class="throttle-head"><span>ENG</span><b>THR</b></div>
  <div id="throttle-track" role="slider" aria-label="Throttle lever" aria-valuemin="75" aria-valuemax="260" aria-valuenow="135" tabindex="0">
    <div class="throttle-scale"><i>MAX</i><i>MIL</i><i>IDLE</i></div>
    <div id="throttle-lever"><span class="lever-grip"></span><span class="lever-cap"></span></div>
  </div>
  <div class="throttle-readout"><span>RPM CMD</span><b id="throttle-value">135</b></div>
</div>

<!-- Combat Touch Buttons -->
<div id="gun" class="btn">GUN<br>20MM</div>
<div id="msl" class="btn">MSL 6</div>
<div id="flare" class="btn" aria-label="Release a three-flare salvo">FLR 6</div>

<div id="rot">&#8635;<br>ROTATE YOUR PHONE<br>TO LANDSCAPE</div>

<!-- Main / Pause Menu Overlay -->
<div id="menu">
  <div class="panel">
    <h1 class="title-main" id="menu-heading">MACH ZERO</h1>
    <div class="title-sub" id="menu-sub"></div>

    <div class="menu-grid" id="menu-main-actions">
      <button class="mbtn primary" id="btn-start">START 1V1</button>
      <button class="mbtn primary" id="btn-start-2v2">START 2V2</button>
      <button class="mbtn" id="btn-controls">CONTROLS</button>
      <button class="mbtn" id="btn-opt-cam">VIEW: OUTSIDE</button>
      <button class="mbtn" id="btn-opt-snd">SOUND: ON</button>
      <button class="mbtn" id="btn-opt-res">RENDER: BALANCED</button>
    </div>

    <div class="controls-panel" id="menu-controls" hidden>
      <div class="control-list">
        <div class="control-row"><span>FLY</span><b>WASD / ARROWS / DRAG</b></div>
        <div class="control-row"><span>GUN</span><b>SPACE / GUN BUTTON</b></div>
        <div class="control-row"><span>MISSILE</span><b>R / ENTER / MISSILE BUTTON</b></div>
        <div class="control-row"><span>FLARES</span><b>F / FLARE BUTTON</b></div>
        <div class="control-row"><span>THROTTLE</span><b>HOLD Q / E · USE LEVER</b></div>
        <div class="control-row"><span>VIEW</span><b>C / V</b></div>
        <div class="control-row"><span>MENU</span><b>M / ESC</b></div>
      </div>
      <button class="mbtn" id="btn-controls-back">BACK</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// 1. REALISTIC MULTI-LAYERED MILITARY JET AUDIO ENGINE (WEB AUDIO API)
//    - Zero low-frequency sawtooth "farts" or arcade pitch slides!
//    - Pre-computed White & Pink Noise buffers for authentic aerodynamic shear,
//      solid-propellant rocket "SWOOSH", and multi-stage ordnance "KABOOM".
// ============================================================================
const SFX = {
  ctx: null,
  master: null,
  comp: null,
  whiteBuf: null,
  pinkBuf: null,
  distCurve: null,
  muted: false,
  running: false,
  pylonSide: 1,
  // Continuous engine nodes
  airGain: null,
  airFilter: null,
  whineGain: null,
  whineFilter1: null,
  whineFilter2: null,
  roarGain: null,
  roarFilter: null,
  lockTimer: 0,
  gunTimer: 0,
  warningTimer: 0,
  warningLevel: 0,

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();

    // Master dynamics compressor so explosions & missiles hit hard without clipping
    this.comp = this.ctx.createDynamicsCompressor();
    this.comp.threshold.value = -10;
    this.comp.knee.value = 12;
    this.comp.ratio.value = 6;
    this.comp.attack.value = 0.002;
    this.comp.release.value = 0.18;

    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.82;
    this.comp.connect(this.master);
    this.master.connect(this.ctx.destination);

    // Pre-generate 3-second White Noise & Pink Noise buffers
    const sr = this.ctx.sampleRate;
    const len = sr * 3;
    this.whiteBuf = this.ctx.createBuffer(1, len, sr);
    this.pinkBuf = this.ctx.createBuffer(1, len, sr);
    const wData = this.whiteBuf.getChannelData(0);
    const pData = this.pinkBuf.getChannelData(0);

    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      wData[i] = w;
      // Paul Kellet's pink noise filter
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      pData[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.045;
      b6 = w * 0.115926;
    }

    // Soft-clipping waveshaper curve for crisp explosion transient crack
    this.distCurve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) {
      const x = (i * 2) / 1024 - 1;
      this.distCurve[i] = ((3 + 12) * x * 20 * (Math.PI / 180)) / (Math.PI + 12 * Math.abs(x));
    }

    this.setupContinuousJetEngine();
  },

  setupContinuousJetEngine() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;

    // 1. High-altitude airframe wind rush (filtered pink noise)
    const airSrc = this.ctx.createBufferSource();
    airSrc.buffer = this.pinkBuf;
    airSrc.loop = true;
    this.airFilter = this.ctx.createBiquadFilter();
    this.airFilter.type = 'bandpass';
    this.airFilter.frequency.setValueAtTime(520, t);
    this.airFilter.Q.setValueAtTime(0.7, t);
    this.airGain = this.ctx.createGain();
    this.airGain.gain.setValueAtTime(0.001, t);
    airSrc.connect(this.airFilter);
    this.airFilter.connect(this.airGain);
    this.airGain.connect(this.comp);
    airSrc.start(t);

    // 2. Jet Turbine Compressor Whine (High-Q resonant noise bands, no buzzy sawtooth!)
    const whineSrc = this.ctx.createBufferSource();
    whineSrc.buffer = this.whiteBuf;
    whineSrc.loop = true;
    this.whineFilter1 = this.ctx.createBiquadFilter();
    this.whineFilter1.type = 'bandpass';
    this.whineFilter1.frequency.setValueAtTime(1950, t);
    this.whineFilter1.Q.setValueAtTime(18, t);

    this.whineFilter2 = this.ctx.createBiquadFilter();
    this.whineFilter2.type = 'bandpass';
    this.whineFilter2.frequency.setValueAtTime(3650, t);
    this.whineFilter2.Q.setValueAtTime(22, t);

    this.whineGain = this.ctx.createGain();
    this.whineGain.gain.setValueAtTime(0.001, t);

    whineSrc.connect(this.whineFilter1);
    whineSrc.connect(this.whineFilter2);
    this.whineFilter1.connect(this.whineGain);
    this.whineFilter2.connect(this.whineGain);
    this.whineGain.connect(this.comp);
    whineSrc.start(t);

    // 3. Deep Afterburner Jet Stream Roar (Pink noise sculpted between 90Hz-360Hz)
    const roarSrc = this.ctx.createBufferSource();
    roarSrc.buffer = this.pinkBuf;
    roarSrc.loop = true;
    const roarHP = this.ctx.createBiquadFilter();
    roarHP.type = 'highpass';
    roarHP.frequency.setValueAtTime(85, t);
    this.roarFilter = this.ctx.createBiquadFilter();
    this.roarFilter.type = 'lowpass';
    this.roarFilter.frequency.setValueAtTime(260, t);
    this.roarGain = this.ctx.createGain();
    this.roarGain.gain.setValueAtTime(0.001, t);

    roarSrc.connect(roarHP);
    roarHP.connect(this.roarFilter);
    this.roarFilter.connect(this.roarGain);
    this.roarGain.connect(this.comp);
    roarSrc.start(t);

    this.running = true;
  },

  updateEngine(active, turnLoad, pitchVal, camMode) {
    if (!this.ctx || !this.running) return;
    const t = this.ctx.currentTime;
    if (!active || this.muted) {
      this.airGain.gain.setTargetAtTime(0.0001, t, 0.08);
      this.whineGain.gain.setTargetAtTime(0.0001, t, 0.08);
      this.roarGain.gain.setTargetAtTime(0.0001, t, 0.08);
      return;
    }
    const extBoost = camMode === 'outside' ? 1.22 : 0.88;
    const gLoad = Math.min(1, Math.abs(turnLoad) + Math.abs(pitchVal) * 0.6);
    const throttleNorm = cl((throttle - 75) / 185, 0, 1);

    // A jet's sound changes with spool demand as well as airspeed and loading.
    // Filter sweeps are deliberately slow to avoid synthetic pitch wobble.
    const diveFactor = Math.max(-0.4, Math.min(0.6, -pitchVal));
    this.airFilter.frequency.setTargetAtTime(420 + throttleNorm * 170 + gLoad * 290 + diveFactor * 150, t, 0.12);
    this.airGain.gain.setTargetAtTime((0.075 + throttleNorm * 0.075 + gLoad * 0.09) * extBoost, t, 0.12);

    this.whineFilter1.frequency.setTargetAtTime(1450 + throttleNorm * 780 + gLoad * 300 + diveFactor * 160, t, 0.16);
    this.whineFilter2.frequency.setTargetAtTime(2820 + throttleNorm * 1120 + gLoad * 470 + diveFactor * 240, t, 0.16);
    this.whineGain.gain.setTargetAtTime((0.016 + throttleNorm * 0.038 + gLoad * 0.015) * extBoost, t, 0.14);

    this.roarFilter.frequency.setTargetAtTime(190 + throttleNorm * 185 + gLoad * 95, t, 0.16);
    this.roarGain.gain.setTargetAtTime((0.12 + throttleNorm * 0.16 + gLoad * 0.09) * extBoost, t, 0.14);
  },

  playFlareBurst() {
    this.init();
    if (!this.ctx || this.muted || !this.comp || !this.whiteBuf) return;
    const t = this.ctx.currentTime;
    // Three quick pneumatic ejector pops followed by a short hot-gas hiss.
    for (let i = 0; i < 3; i++) {
      const start = t + i * 0.045;
      const osc = this.ctx.createOscillator();
      const og = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(185 - i * 14, start);
      osc.frequency.exponentialRampToValueAtTime(72, start + 0.075);
      og.gain.setValueAtTime(0.001, start);
      og.gain.linearRampToValueAtTime(0.12, start + 0.008);
      og.gain.exponentialRampToValueAtTime(0.001, start + 0.09);
      osc.connect(og); og.connect(this.comp);
      osc.start(start); osc.stop(start + 0.1);
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.whiteBuf;
    const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.setValueAtTime(900, t);
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(2400, t); bp.Q.setValueAtTime(.65, t);
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(.001, t); ng.gain.linearRampToValueAtTime(.095, t + .025);
    ng.gain.exponentialRampToValueAtTime(.001, t + .28);
    noise.connect(hp); hp.connect(bp); bp.connect(ng); ng.connect(this.comp);
    noise.start(t, Math.random() * 1.5, .32);
  },

  // ==========================================================================
  // REALISTIC SOLID-PROPELLANT ROCKET MOTOR LAUNCH ("SWOOSH / FWOOSH")
  // High-velocity supersonic air shear + dual Doppler bandpass sweep.
  // ==========================================================================
  playMissileLaunch() {
    this.init();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;

    // Stereo Panner (alternates Left/Right wingtip rail)
    this.pylonSide = -this.pylonSide;
    const panNode = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : this.ctx.createGain();
    if (panNode.pan) {
      panNode.pan.setValueAtTime(this.pylonSide * 0.35, t);
      panNode.pan.linearRampToValueAtTime(0, t + 0.9);
    }
    panNode.connect(this.comp);

    // LAYER 1: Pylon umbilical release latch click (crisp mechanical snap, 25ms)
    const clickSrc = this.ctx.createBufferSource();
    clickSrc.buffer = this.whiteBuf;
    const clickBP = this.ctx.createBiquadFilter();
    clickBP.type = 'bandpass';
    clickBP.frequency.setValueAtTime(2200, t);
    clickBP.Q.setValueAtTime(3.0, t);
    const clickGain = this.ctx.createGain();
    clickGain.gain.setValueAtTime(0.45, t);
    clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    clickSrc.connect(clickBP);
    clickBP.connect(clickGain);
    clickGain.connect(panNode);
    clickSrc.start(t, Math.random() * 1.5, 0.04);

    // Subtle clean pneumatic thump (pure sine 120Hz -> 48Hz over 55ms, never buzzes)
    const pneuOsc = this.ctx.createOscillator();
    pneuOsc.type = 'sine';
    pneuOsc.frequency.setValueAtTime(125, t);
    pneuOsc.frequency.exponentialRampToValueAtTime(48, t + 0.055);
    const pneuGain = this.ctx.createGain();
    pneuGain.gain.setValueAtTime(0.22, t);
    pneuGain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    pneuOsc.connect(pneuGain);
    pneuGain.connect(panNode);
    pneuOsc.start(t);
    pneuOsc.stop(t + 0.065);

    // LAYER 2: THE ROCKET "SWOOSH" (High-Velocity Solid Propellant Jet Stream)
    // Strictly high-passed above 380Hz so there is ZERO muddy low-end "fart" sound!
    const swooshSrc = this.ctx.createBufferSource();
    swooshSrc.buffer = this.whiteBuf;

    const cleanHP = this.ctx.createBiquadFilter();
    cleanHP.type = 'highpass';
    cleanHP.frequency.setValueAtTime(380, t);

    // Primary aerodynamic whoosh formant (sweeps up as rocket accelerates past canopy, then Doppler drops)
    const bp1 = this.ctx.createBiquadFilter();
    bp1.type = 'bandpass';
    bp1.Q.setValueAtTime(1.65, t);
    bp1.frequency.setValueAtTime(680, t);
    bp1.frequency.exponentialRampToValueAtTime(3100, t + 0.16);
    bp1.frequency.exponentialRampToValueAtTime(880, t + 1.45);

    // Secondary broader jet exhaust rush
    const bp2 = this.ctx.createBiquadFilter();
    bp2.type = 'bandpass';
    bp2.Q.setValueAtTime(0.85, t);
    bp2.frequency.setValueAtTime(1100, t);
    bp2.frequency.exponentialRampToValueAtTime(4400, t + 0.14);
    bp2.frequency.exponentialRampToValueAtTime(1250, t + 1.45);

    const swooshGain = this.ctx.createGain();
    swooshGain.gain.setValueAtTime(0.01, t);
    swooshGain.gain.linearRampToValueAtTime(0.95, t + 0.055);
    swooshGain.gain.exponentialRampToValueAtTime(0.35, t + 0.42);
    swooshGain.gain.exponentialRampToValueAtTime(0.001, t + 1.5);

    swooshSrc.connect(cleanHP);
    cleanHP.connect(bp1);
    cleanHP.connect(bp2);
    bp1.connect(swooshGain);
    bp2.connect(swooshGain);
    swooshGain.connect(panNode);
    swooshSrc.start(t, Math.random() * 1.0, 1.55);

    // LAYER 3: Supersonic Air-Shear Sizzle / Exhaust Tear (> 2900Hz crisp hiss)
    const sizzleSrc = this.ctx.createBufferSource();
    sizzleSrc.buffer = this.whiteBuf;
    const sizzleHP = this.ctx.createBiquadFilter();
    sizzleHP.type = 'highpass';
    sizzleHP.frequency.setValueAtTime(2900, t);
    sizzleHP.frequency.exponentialRampToValueAtTime(1600, t + 1.1);

    const sizzleGain = this.ctx.createGain();
    sizzleGain.gain.setValueAtTime(0.01, t);
    sizzleGain.gain.linearRampToValueAtTime(0.52, t + 0.035);
    sizzleGain.gain.exponentialRampToValueAtTime(0.001, t + 1.15);

    sizzleSrc.connect(sizzleHP);
    sizzleHP.connect(sizzleGain);
    sizzleGain.connect(panNode);
    sizzleSrc.start(t, Math.random() * 1.2, 1.2);
  },

  // ==========================================================================
  // REALISTIC ORDNANCE DETONATION ("KABOOM" - CRACK + SHOCKWAVE + THUNDER)
  // ==========================================================================
  playExplosion(dist = 200, isBig = true) {
    this.init();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;

    // Distance attenuation
    const atten = Math.max(0.18, Math.min(1.0, 450 / Math.max(120, dist)));
    const scale = (isBig ? 1.0 : 0.48) * atten;

    // LAYER 1: Detonation High-Explosive "CRACK" (Distorted mid-high snap)
    const crackSrc = this.ctx.createBufferSource();
    crackSrc.buffer = this.whiteBuf;
    const crackBP = this.ctx.createBiquadFilter();
    crackBP.type = 'bandpass';
    crackBP.frequency.setValueAtTime(isBig ? 1350 : 1900, t);
    crackBP.Q.setValueAtTime(0.9, t);

    const shaper = this.ctx.createWaveShaper();
    shaper.curve = this.distCurve;

    const crackGain = this.ctx.createGain();
    crackGain.gain.setValueAtTime(0.85 * scale, t);
    crackGain.gain.exponentialRampToValueAtTime(0.001, t + (isBig ? 0.14 : 0.07));

    crackSrc.connect(crackBP);
    crackBP.connect(shaper);
    shaper.connect(crackGain);
    crackGain.connect(this.comp);
    crackSrc.start(t, Math.random() * 1.5, 0.16);

    // LAYER 2: Chest-Hitting Sub-Bass Shockwave "THUMP" (Pure Sine/Triangle, NO Sawtooth!)
    const subOsc = this.ctx.createOscillator();
    subOsc.type = 'sine';
    subOsc.frequency.setValueAtTime(isBig ? 98 : 130, t);
    subOsc.frequency.exponentialRampToValueAtTime(24, t + (isBig ? 0.58 : 0.25));

    const punchOsc = this.ctx.createOscillator();
    punchOsc.type = 'triangle';
    punchOsc.frequency.setValueAtTime(isBig ? 68 : 95, t);
    punchOsc.frequency.exponentialRampToValueAtTime(20, t + (isBig ? 0.45 : 0.2));

    const subGain = this.ctx.createGain();
    subGain.gain.setValueAtTime(1.15 * scale, t);
    subGain.gain.exponentialRampToValueAtTime(0.001, t + (isBig ? 0.65 : 0.28));

    subOsc.connect(subGain);
    punchOsc.connect(subGain);
    subGain.connect(this.comp);
    subOsc.start(t);
    punchOsc.start(t);
    subOsc.stop(t + 0.7);
    punchOsc.stop(t + 0.5);

    // LAYER 3: Rolling Sky Thunder & Fireball Roar (Filtered Pink Noise Tail)
    const dur = isBig ? 2.1 : 0.75;
    const roarSrc = this.ctx.createBufferSource();
    roarSrc.buffer = this.pinkBuf;

    const roarLP = this.ctx.createBiquadFilter();
    roarLP.type = 'lowpass';
    roarLP.frequency.setValueAtTime(isBig ? 780 : 1050, t);
    roarLP.frequency.exponentialRampToValueAtTime(75, t + dur);

    const roarGain = this.ctx.createGain();
    roarGain.gain.setValueAtTime(0.01, t);
    roarGain.gain.linearRampToValueAtTime(1.1 * scale, t + 0.025);
    roarGain.gain.exponentialRampToValueAtTime(0.32 * scale, t + 0.45);
    roarGain.gain.exponentialRampToValueAtTime(0.001, t + dur);

    roarSrc.connect(roarLP);
    roarLP.connect(roarGain);
    roarGain.connect(this.comp);
    roarSrc.start(t, Math.random() * 0.8, dur + 0.05);
  },

  // ==========================================================================
  // M61 VULCAN 20MM ROTARY CANNON PULSE ("BRRRRRRT")
  // ==========================================================================
  playCannonPulse(distance = 0, pan = 0, volume = 1) {
    this.init();
    if (!this.ctx || this.muted || !this.comp || !this.whiteBuf) return;
    const t = this.ctx.currentTime;
    const attenuation = distance > 0 ? Math.max(0.10, Math.pow(1 + distance / 850, -1.25)) : 1;
    const amp = cl(volume, 0, 1) * attenuation;
    const stereo = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : this.ctx.createGain();
    if (stereo.pan) stereo.pan.setValueAtTime(cl(pan, -1, 1), t);
    stereo.connect(this.comp);

    // Short broadband muzzle crack with a crisp upper-mid transient.
    const crack = this.ctx.createBufferSource();
    crack.buffer = this.whiteBuf;
    const crackHP = this.ctx.createBiquadFilter();
    crackHP.type = 'highpass'; crackHP.frequency.setValueAtTime(720, t);
    const crackBP = this.ctx.createBiquadFilter();
    crackBP.type = 'bandpass'; crackBP.frequency.setValueAtTime(1850 + Math.random() * 500, t); crackBP.Q.setValueAtTime(0.9, t);
    const crackGain = this.ctx.createGain();
    crackGain.gain.setValueAtTime(0.001, t);
    crackGain.gain.linearRampToValueAtTime(0.29 * amp, t + 0.0025);
    crackGain.gain.exponentialRampToValueAtTime(0.001, t + 0.052);
    crack.connect(crackHP); crackHP.connect(crackBP); crackBP.connect(crackGain); crackGain.connect(stereo);
    crack.start(t, Math.random() * 2.5, 0.06);

    // Compact breech / receiver thump; the pitch falls quickly like a real report.
    const body = this.ctx.createOscillator();
    body.type = 'sine';
    body.frequency.setValueAtTime(118 + Math.random() * 18, t);
    body.frequency.exponentialRampToValueAtTime(54, t + 0.047);
    const bodyGain = this.ctx.createGain();
    bodyGain.gain.setValueAtTime(0.13 * amp, t);
    bodyGain.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
    body.connect(bodyGain); bodyGain.connect(stereo);
    body.start(t); body.stop(t + 0.06);

    // A very quiet high-frequency action/casing tick gives the shot definition.
    const tickSrc = this.ctx.createBufferSource();
    tickSrc.buffer = this.whiteBuf;
    const tickBP = this.ctx.createBiquadFilter();
    tickBP.type = 'bandpass'; tickBP.frequency.setValueAtTime(4300, t + 0.012); tickBP.Q.setValueAtTime(1.5, t + 0.012);
    const tickGain = this.ctx.createGain();
    tickGain.gain.setValueAtTime(0.001, t + 0.012);
    tickGain.gain.linearRampToValueAtTime(0.045 * amp, t + 0.014);
    tickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.042);
    tickSrc.connect(tickBP); tickBP.connect(tickGain); tickGain.connect(stereo);
    tickSrc.start(t + 0.012, Math.random() * 2, 0.035);
  },

  // ==========================================================================
  // AIM-9 SIDEWINDER RADAR SEEKER TONE
  // ==========================================================================
  updateLockTone(dt, hasTarget, isLocked) {
    if (!this.ctx || this.muted || !hasTarget) return;
    this.lockTimer -= dt;
    if (this.lockTimer <= 0) {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      if (isLocked) {
        // Urgent high dual-warble hard lock
        this.lockTimer = 0.085;
        osc.type = 'sine';
        const f = (Math.floor(t * 16) % 2 === 0) ? 980 : 1120;
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.065, t);
        g.gain.exponentialRampToValueAtTime(0.005, t + 0.075);
      } else {
        // Acquiring seeker chirp
        this.lockTimer = 0.22;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, t);
        g.gain.setValueAtTime(0.04, t);
        g.gain.exponentialRampToValueAtTime(0.002, t + 0.07);
      }
      osc.connect(g);
      g.connect(this.comp);
      osc.start(t);
      osc.stop(t + 0.08);
    }
  },

  // A distinct two-pulse impact alarm separates a missile hit from routine
  // cannon impacts and distant explosions. The explosion itself is layered
  // separately by boom() at the aircraft position.
  playMissileHitAlert() {
    if (!this.ctx || this.muted || !this.comp) return;
    const t = this.ctx.currentTime;
    for (let i = 0; i < 2; i++) {
      const start = t + i * 0.19;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(390 - i * 55, start);
      osc.frequency.exponentialRampToValueAtTime(165, start + 0.15);
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(0.095, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.17);
      osc.connect(gain); gain.connect(this.comp);
      osc.start(start); osc.stop(start + 0.18);
    }
  },

  // Three RWR stages: a slow low beep (far), a double mid-tone (tracking),
  // then a sharp high warning whose cadence accelerates continuously in red.
  // The final single pulse avoids overlapping beep trains near impact.
  playMissileWarningBeep(tier) {
    if (!this.ctx || this.muted || !this.comp) return;
    const t = this.ctx.currentTime;
    const freq = [500, 735, 1010][tier];
    const amp = [0.045, 0.072, 0.105][tier];
    const pulses = tier === 2 ? 1 : tier + 1;
    const spacing = tier === 2 ? 0.08 : 0.16;
    const duration = tier === 2 ? 0.075 : 0.105;
    for (let i = 0; i < pulses; i++) {
      const start = t + i * spacing;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = tier === 0 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq * (tier === 2 && i % 2 ? 1.08 : 1), start);
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(amp, start + 0.012);
      gain.gain.setValueAtTime(amp, start + duration * 0.55);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
      osc.connect(gain);
      gain.connect(this.comp);
      osc.start(start);
      osc.stop(start + duration + 0.01);
    }
  },

  updateMissileWarning(dt, distance, closingSpeed) {
    if (!Number.isFinite(distance)) {
      this.warningLevel = 0;
      this.warningTimer = 0;
      return;
    }
    const projectedDistance = Math.max(0, distance - Math.max(0, closingSpeed) * 0.32);
    const tier = projectedDistance < 460 ? 2 : (projectedDistance < 1050 ? 1 : 0);
    const nextLevel = tier + 1;
    if (nextLevel > this.warningLevel) this.warningTimer = 0;
    this.warningLevel = nextLevel;
    this.warningTimer -= dt;
    // Yellow/orange use fixed cadence. In red, cadence accelerates continuously
    // with estimated time-to-impact, so urgency keeps rising after the red cue.
    const timeToImpact = closingSpeed > 1 ? distance / closingSpeed : 4;
    const redUrgency = cl(1 - timeToImpact / 2.4, 0, 1);
    const redInterval = .27 - redUrgency * .19; // 270 ms down to 80 ms
    const interval = tier === 2 ? redInterval : [1.22, 0.62][tier];
    if (this.warningTimer <= 0) {
      this.playMissileWarningBeep(tier);
      this.warningTimer = interval;
    }
  },

  toggleMute() {
    this.init();
    this.muted = !this.muted;
    if (this.master && this.ctx) {
      this.master.gain.setValueAtTime(this.muted ? 0 : 0.82, this.ctx.currentTime);
    }
    return !this.muted;
  }
};

function releaseEnemyFlares(e) {
  if (e.flareCount <= 0 || e.flareCooldown > 0) return;

  for (const side of [-1, 0, 1]) {
    const spread = side * (3.4 + maneuverLoad * 1.6);
    const lateral = side * (side === 0 ? 0 : 28 + maneuverLoad * 30);
    enemyFlares.push({
      x: e.x - fx * 7 + rx * spread,
      y: e.y - fy * 7 + uy * spread - 1.5,
      z: e.z - fz * 7 + rz * spread,
      vx: fx * enemySpeed * .62 + rx * lateral - ux * 12,
      vy: fy * enemySpeed * .62 + uy * lateral - uy * 12 - 12,
      vz: fz * enemySpeed * .62 + rz * lateral - uz * 12,

      warningAtRelease: 3

}

function launchEnemyMissile(e, targetAircraft = P) {
  if (e.missiles <= 0 || !targetAircraft) return false;
  if (incomingMissiles.some(m => m.targetRef === targetAircraft && m.life > 0)) return false;
  const targetState = friendlyAircraftState(targetAircraft);
  const dx = targetState.engine.x - e.x, dy = targetState.engine.y - e.y, dz = targetState.engine.z - e.z;
  const d = Math.hypot(dx, dy, dz) || 1;
  const ux = dx / d, uy = dy / d, uz = dz / d;
  const vl = Math.hypot(e.vx,e.vy,e.vz) || 1;

  const F3=[fx,fy,fz];
  const rail=wingStoreWorld({x:e.x,y:e.y,z:e.z},R3,U3,F3,6-e.missiles,.88);
  const launchSpeed = vl + 145;
  incomingMissiles.push({
    x: rail.x + ux * 2, y: rail.y + uy * 2, z: rail.z + uz * 2,
    vx: ux * launchSpeed, vy: uy * launchSpeed, vz: uz * launchSpeed,
    speed: launchSpeed, motorT: 1.25, age: 0, life: 5,

  if (e.missiles === 0) e.missileRecharge = 0;
  e.missileLock = 0;
  e.missileCD = 1.0;
  return true;
}

let projCy = 1, projSy = 0, projCp = 1, projSp = 0;

// Score a target from the attacker's current nose direction, range and closure.
// The AI can switch between a gun solution and a viable IR-lock opportunity as
// the geometry changes, rather than obeying a fixed player/wingman assignment.
function combatOpportunityScore(attacker, target) {
  if (!attacker || !target) return -1;
  const dx = target.x - attacker.x, dy = target.y - attacker.y, dz = target.z - attacker.z;
  const distance = Math.hypot(dx, dy, dz) || 1;
  const av = Math.hypot(attacker.vx || 0, attacker.vy || 0, attacker.vz || 0) || attacker.airSpeed || 1;
  const tv = Math.hypot(target.vx || 0, target.vy || 0, target.vz || 0) || target.speed || target.airSpeed || 1;
  const leadTime = cl(distance / Math.max(260, av + tv), .05, .62);
  const aimX = dx + ((target.vx || 0) - (attacker.vx || 0)) * leadTime;
  const aimY = dy + ((target.vy || 0) - (attacker.vy || 0)) * leadTime;
  const aimZ = dz + ((target.vz || 0) - (attacker.vz || 0)) * leadTime;
  const aimLength = Math.hypot(aimX, aimY, aimZ) || 1;
  const alignment = cl(((attacker.vx || 0) * aimX + (attacker.vy || 0) * aimY + (attacker.vz || 0) * aimZ) / (av * aimLength), -1, 1);
  const closure = ((attacker.vx || 0) - (target.vx || 0)) * dx / distance +
    ((attacker.vy || 0) - (target.vy || 0)) * dy / distance +
    ((attacker.vz || 0) - (target.vz || 0)) * dz / distance;
  const forward = cl((alignment + .18) / 1.18, 0, 1);
  const closureFactor = cl((closure + 170) / 360, 0, 1);
  const gunRange = cl((1080 - distance) / 980, 0, 1);
  const gunAim = cl((alignment - .62) / .38, 0, 1);
  const gunOpportunity = gunRange * gunAim * (.72 + .28 * closureFactor);
  const missileRange = distance >= 320 && distance <= 2050
    ? cl(1 - Math.abs(distance - 1110) / 1110, 0, 1) : 0;
  const missileAim = cl((alignment - .54) / .46, 0, 1);
  const targetLoad = cl(target.maneuverLoad || 0, 0, 1);
  const missileOpportunity = missileRange * missileAim * (1 - targetLoad * .16);
  const approachBias = .16 * forward * cl(1 - distance / 2700, 0, 1);
  return Math.max(gunOpportunity * .98, missileOpportunity * .96) + approachBias;
}

function chooseEnemyEngagementTarget(enemy) {
  const candidates = [P];
  if (teamMode2v2) for (const w of wingmen) if (!w.dead) candidates.push(w);
  const ranked = candidates.map(target => {
    const state = friendlyAircraftState(target);
    let score = combatOpportunityScore(enemy, state);
    // When two targets offer comparable shots, avoid needlessly stacking both
    // enemies on one friendly aircraft. A clearly better firing solution wins.
    const covered = en.some(other => other !== enemy && !other.dead && other.engagementTarget === target);
    if (covered && candidates.length > 1) score -= .105;
    if (enemy.engagementTarget === target) score += .035;
    return { target, score };
  }).sort((a, b) => b.score - a.score);
  let best = ranked[0] || { target: P, score: -1 };
  const current = ranked.find(item => item.target === enemy.engagementTarget);
  // Small hysteresis prevents frame-to-frame indecision without freezing the AI.
  if (current && best.target !== current.target && best.score < current.score + .085) best = current;
  if (enemy.engagementTarget !== best.target) {
    enemy.engagementTarget = best.target;
    enemy.missileLock = 0;
  }
  return best.target;
}

function chooseWingmanEngagementTarget(wingman) {
  const candidates = en.filter(enemy => !enemy.dead).map(enemy => ({
    enemy, score: combatOpportunityScore(wingman, enemy)

  let best = candidates[0] || null;
  const current = candidates.find(item => item.enemy === wingman.engagementTarget);
  if (current && best && best.enemy !== current.enemy && best.score < current.score + .075) best = current;
  const selected = best ? best.enemy : null;
  if (wingman.engagementTarget !== selected) {
    wingman.engagementTarget = selected;
    wingman.missileLock = 0;
    wingman.lockTarget = null;
  }
  if (!best) return null;
  const d = Math.hypot(best.enemy.x - wingman.x, best.enemy.y - wingman.y, best.enemy.z - wingman.z);
  return { e: best.enemy, d, score: best.score };
}

function tryAcquireFlare(missile, flareList, targetPoint, targetRange, targetSignature, dt) {

// weapon coasts and bleeds speed while pulling. A high-G target can demand
// more turn than the seeker/airframe can supply, creating a genuine overshoot.
function guideMissile(m, targetPoint, dt, targetManeuver = 0, isDecoy = false, targetSignature = 1) {

  let missileSpeed = Number.isFinite(m[speedKey]) ? m[speedKey] : Math.hypot(m.vx, m.vy, m.vz);

  missileSpeed = m.motorT > 0 ? Math.min(590, missileSpeed + 225 * dt) : Math.max(275, missileSpeed - 17 * dt);

  let vl = Math.hypot(m.vx, m.vy, m.vz);
  if (!Number.isFinite(vl) || vl < 1e-6) { m.vx = 0; m.vy = 0; m.vz = missileSpeed; vl = missileSpeed; }

  if (targetPoint && Number.isFinite(targetPoint.x) && Number.isFinite(targetPoint.y) && Number.isFinite(targetPoint.z)) {
    const dx = targetPoint.x - m.x, dy = targetPoint.y - m.y, dz = targetPoint.z - m.z;
    const dl = Math.hypot(dx, dy, dz);
    if (Number.isFinite(dl) && dl > 1e-5) {
      const tx = dx / dl, ty = dy / dl, tz = dz / dl;
      const dot = cl(hx * tx + hy * ty + hz * tz, -1, 1);
      const angle = Math.acos(dot);
      const energyFactor = cl(missileSpeed / 440, .72, 1.08);
      const baseRate = (m.motorT > 0 ? 1.66 : 1.16) * energyFactor * cl(targetSignature, .46, 1.08);
      const targetPenalty = isDecoy ? 1.05 : 1 - .50 * cl(targetManeuver, 0, 1);
      const step = Math.min(angle, baseRate * targetPenalty * Math.min(dt, .05), .072);
      if (step > 1e-6) {

        // that cross product is undefined, so choose a deterministic level axis.
        let ax = hy * tz - hz * ty;
        let ay = hz * tx - hx * tz;
        let az = hx * ty - hy * tx;
        let al = Math.hypot(ax, ay, az);
        if (al < 1e-6) {
          if (dot > 0) { ax = 0; ay = 0; az = 0; }
          else {
            ax = -hz; ay = 0; az = hx;
            al = Math.hypot(ax, ay, az);
            if (al < 1e-6) { ax = 1; ay = 0; az = 0; al = 1; }

          const nz = hz * c + (ax * hy - ay * hx) * sn + az * ad * (1 - c);

        }

  m.vx = hx * missileSpeed; m.vy = hy * missileSpeed; m.vz = hz * missileSpeed;
}

let ctrlX = 0, ctrlY = 0;

function update(dt) {
  tick += dt;
  if (paused || state !== 'play') {
    SFX.updateEngine(false, 0, 0, viewMode);
    SFX.updateMissileWarning(0, Infinity, 0);
    yaw += 0.04 * dt;
    camYaw = yaw; camPitch = 0; camRoll = 0;
    camX = P.x - Math.sin(yaw) * 25;
    camY = P.y + 6;
    camZ = P.z - Math.cos(yaw) * 25;
    return;
  }

  // A blackout lasts briefly; the aircraft keeps its current flight vector while
  // the pilot is unresponsive. Exposure accumulates faster as G rises.
  const unconsciousAtFrameStart = consciousnessT > 0;
  if (unconsciousAtFrameStart) {
    consciousnessT = Math.max(0, consciousnessT - dt);
    if (consciousnessT <= 0) {
      gLocCooldownT = 3.4;
      msgT = 0; msgS = '';
    }
  } else {
    gLocCooldownT = Math.max(0, gLocCooldownT - dt);
  }
  let incapacitated = consciousnessT > 0;
  let sx = incapacitated ? 0 : cl(stick.x + keys.r - keys.l, -1, 1);
  let sy = incapacitated ? 0 : cl(stick.y + keys.d - keys.u, -1, 1);
  ctrlX += (sx - ctrlX) * Math.min(1, 10 * dt);
  ctrlY += (sy - ctrlY) * Math.min(1, 10 * dt);

  // Q/E provide smooth, hold-to-adjust throttle on desktop; the lever remains draggable on touch.
  const throttleInput = incapacitated ? 0 : keys.tUp - keys.tDown;
  if (throttleInput) { throttle = cl(throttle + throttleInput * 72 * dt, 75, 260); updateThrottleControl(); }
  // Airspeed has real inertia: it approaches the throttle demand progressively, not almost instantly.
  speed += (throttle - speed) * Math.min(1, 0.72 * dt);
  const commandedTurn = Math.hypot(sx, sy);

      consciousnessT = 2.0;
      incapacitated = true;
      highGTime = 0;
      tunnelVision = .97;
      sx = sy = 0;
      stick.x = stick.y = 0;
      keys.l = keys.r = keys.u = keys.d = keys.f = keys.m = 0;

  }

  const sustainedLoad = cl(highGTime / GLOC_EXPOSURE_LIMIT, 0, 1);
  const tunnelTarget = cl((gForce - 4.5) / 4.8, 0, .65) + sustainedLoad * .34;

  pitch = cl(pitch, -1, 1);

  P.y += f[1] * speed * dt;
  P.z += f[2] * speed * dt;

  if (viewMode === 'outside') {

    camYaw += (yaw - camYaw) * chaseLerp;
    camPitch += (pitch * 0.78 - camPitch) * chaseLerp;
    camRoll += (roll * 0.42 - camRoll) * chaseLerp;

    // Position camera behind and slightly above the jet so the dorsal airframe,
    // wings, canopy, and twin tails are in full view
    const backDist = 30.5;
    const upOffset = 6.2;
    camX = P.x - f[0] * backDist;
    camY = Math.max(8, P.y - f[1] * backDist + upOffset);
    camZ = P.z - f[2] * backDist;

    // High-G condensation forms at the loaded wingtips and streams aft as
    // persistent, tapered vortices instead of disconnected floating dots.
    const gForce = Math.hypot(sx, sy);
    const vaporLoad = cl((gForce - .30) / .68, 0, 1) * cl((speed - 85) / 105, 0, 1);
    if (vaporLoad > .04) {
      wingEmitTimer -= dt;
      if (wingEmitTimer <= 0) {
        const basis = getJetBasis(yaw, pitch, roll);
        for (const side of [-1, 1]) {
          const stream = wingTrails[side > 0 ? 1 : 0];
          stream.push({
            x: P.x + basis.R[0] * (6.5 * side) + basis.U[0] * .16 - basis.F[0] * 4.8,
            y: P.y + basis.R[1] * (6.5 * side) + basis.U[1] * .16 - basis.F[1] * 4.8,
            z: P.z + basis.R[2] * (6.5 * side) + basis.U[2] * .16 - basis.F[2] * 4.8,
            life: .62, maxLife: .62, strength: vaporLoad

      }
    } else {
      wingEmitTimer = 0;
    }
  } else {
    camYaw = yaw;
    camPitch = pitch;
    camRoll = roll;
    camX = P.x;
    camY = P.y;
    camZ = P.z;
  }

  for (const stream of wingTrails) {
    let live = 0;
    for (let i = 0; i < stream.length; i++) {
      const trail = stream[i];

      if (trail.life > 0) stream[live++] = trail;
    }
    stream.length = live;
  }

  // Update realistic continuous jet sound
  SFX.updateEngine(true, sx, pitch, viewMode);

  // Target Lock-On System
  let be = null, bc = .986;
  for (const e of en) {
    const dx = e.x - P.x, dy = e.y - P.y, dz = e.z - P.z, d = Math.hypot(dx, dy, dz);
    if (d > 1600 || d < 30) continue;

  }
  if (lockE && lockE.dead) lockE = null;
  if (be) {
    if (be !== lockE) { lockE = be; lockT = 0; }

  } else {
    lockT -= dt * 2;
    if (lockT <= 0) { lockT = 0; lockE = null; }
  }

  SFX.updateLockTone(dt, !!lockE, locked);

  fireT -= dt; mcd -= dt; msgT -= dt; flareCooldown = Math.max(0, flareCooldown - dt);
  impactFeedbackT = Math.max(0, impactFeedbackT - dt);
  if (missiles === 0) {
    missileReloadT += dt;
    if (missileReloadT >= MISSILE_RACK_RELOAD_SECONDS) {

    }
  } else missileReloadT = 0;
  if (flareCount === 0) {
    flareRechargeT += dt;
    if (flareRechargeT >= FLARE_RACK_RELOAD_SECONDS) {

    }
  } else flareRechargeT = 0;

  if (gunOverheated) {
    gunHeat = Math.max(0, gunHeat - GUN_OVERHEAT_COOL * dt);
    if (gunHeat <= 28) gunOverheated = false;
  } else {
    gunHeat = Math.max(0, gunHeat - (keys.f ? GUN_COOL_WHILE_FIRING : GUN_COOL_RATE) * dt);
  }

  if (!incapacitated && keys.f && fireT <= 0) {
    if (gunOverheated) {
      fireT = .10;
    } else {
      fireT = .062;
      const sp = speed + 420;
      bl.push({
        x: P.x + f[0] * 8, y: P.y + f[1] * 8 - 0.8, z: P.z + f[2] * 8,
        vx: f[0] * sp, vy: f[1] * sp, vz: f[2] * sp, l: 1.55, e: 0
      });
      gunHeat = Math.min(GUN_HEAT_MAX, gunHeat + GUN_HEAT_PER_SHOT);
      if (gunHeat >= GUN_HEAT_MAX) {

      }

      shake = .22;
    }
  }

  if (!incapacitated && keys.m) {
    keys.m = 0;
    if (missiles <= 0) { msgT = .9; msgS = 'NO MISSILES'; }
    else if (!locked) { msgT = .9; msgS = 'NO LOCK - ALIGN NOSE'; }
    else if (mcd <= 0) {
      const v = speed + 160;
      const basis = getJetBasis(yaw, pitch, roll);
      const storeSlot = 6 - missiles;
      const rail = wingStoreWorld(P, basis.R, basis.U, basis.F, storeSlot, 1);
      const mx = rail.x + f[0] * 1.9;
      const my = rail.y + f[1] * 1.9;
      const mz = rail.z + f[2] * 1.9;

        x: mx, y: my, z: mz,

      });

  for (const m of ms) {
    const oldMX = m.x, oldMY = m.y, oldMZ = m.z;
    m.age = (m.age || 0) + dt;
    const enemyTargetNow = m.t && !m.t.dead ? enemyEnginePoint(m.t) : null;
    const enemyTargetRange = enemyTargetNow ? Math.hypot(enemyTargetNow.x - m.x, enemyTargetNow.y - m.y, enemyTargetNow.z - m.z) : Infinity;
    const enemyTargetSpeed = m.t && !m.t.dead ? Math.hypot(m.t.vx, m.t.vy, m.t.vz) : 260;

    const playerMissileDecoy = m.flareTarget && m.flareTarget.life > 0 ? m.flareTarget : null;

    let aimPoint = null, targetPoint = null, targetLoad = 0;
    if (missileTarget) {

      aimPoint = playerMissileDecoy ? targetPoint : {

      };

    const targetSignature = playerMissileDecoy ? 1.05 : (.42 + .58 * engineHeatSignature(targetVelocity));
    const targetVx = playerMissileDecoy ? playerMissileDecoy.vx : (missileTarget ? missileTarget.vx : 0);
    const targetVy = playerMissileDecoy ? playerMissileDecoy.vy : (missileTarget ? missileTarget.vy : 0);

    if (playerMissileDecoy && segmentPointDistance(oldMX, oldMY, oldMZ, m.x, m.y, m.z, playerMissileDecoy.x, playerMissileDecoy.y, playerMissileDecoy.z) < 15) {

    e.evadeCooldown = Math.max(0, e.evadeCooldown - dt);
    e.gunEvadeCooldown = Math.max(0, (e.gunEvadeCooldown || 0) - dt);
    e.flareCooldown = Math.max(0, e.flareCooldown - dt);
    e.tailDefenseCooldown = Math.max(0, (e.tailDefenseCooldown || 0) - dt);
    const wasTailDefending = (e.tailDefenseT || 0) > 0;
    e.tailDefenseT = Math.max(0, (e.tailDefenseT || 0) - dt);
    if (wasTailDefending && e.tailDefenseT <= 0) {

    const targetState = friendlyAircraftState(targetAircraft);

      e.tailDefenseMode = (speed > e.airSpeed + 5 || e.energy < .78) ? 'drag' : 'extend';
      e.tailDefenseT = e.tailDefenseMode === 'drag' ? R(1.8, 2.5) : R(2.0, 2.8);

      e.orbitSign = -e.tailDefenseSide;
    }

    // distance threshold alone made the old AI react late or flare at harmless shots.
    let guidedThreat = null;
    let guidedThreatD = 1e9;
    let guidedThreatTti = Infinity;
    let guidedThreatMiss = 1e9;
    let guidedThreatClosing = 0;
    let guidedThreatRank = 1e9;
    let guidedThreatAvoidX = 0, guidedThreatAvoidZ = 0;
    for (const missile of ms) {
      // Once the seeker has committed to an enemy flare, that weapon is no
      // longer an immediate aircraft threat; do not waste a second break/flare.
      if (missile.t !== e || missile.l <= 0 || (missile.flareTarget && missile.flareTarget.life > 0)) continue;
      const rx = e.x - missile.x, ry = e.y - missile.y, rz = e.z - missile.z;
      const rvx = e.vx - missile.vx, rvy = e.vy - missile.vy, rvz = e.vz - missile.vz;
      const rangeNow = Math.hypot(rx, ry, rz) || 1;
      const rvSq = rvx * rvx + rvy * rvy + rvz * rvz;
      const tClosest = rvSq > 1 ? cl(-(rx * rvx + ry * rvy + rz * rvz) / rvSq, 0, 3.8) : 0;
      const missX = rx + rvx * tClosest;
      const missY = ry + rvy * tClosest;
      const missZ = rz + rvz * tClosest;
      const predictedMiss = Math.hypot(missX, missY, missZ);
      const radialClosing = -(rx * rvx + ry * rvy + rz * rvz) / rangeNow;
      const credible = rangeNow < 1850 && predictedMiss < 142 &&
        (tClosest > .10 || rangeNow < 360) && radialClosing > 18;
      const rank = predictedMiss + tClosest * 24;
      if (credible && rank < guidedThreatRank) {

        guidedThreat = missile;
        guidedThreatD = rangeNow;
        guidedThreatTti = tClosest;
        guidedThreatMiss = predictedMiss;
        guidedThreatClosing = radialClosing;
        guidedThreatAvoidX = missX;
        guidedThreatAvoidZ = missZ;

    }

    if (guidedThreat && e.evadeCooldown <= 0) {

      const perpX = -guidedThreat.vz / mh;
      const perpZ = guidedThreat.vx / mh;

    if ((targetHasLock || playerHasGunSolution) && e.gunEvadeCooldown <= 0 && e.evadeT <= 0) {
