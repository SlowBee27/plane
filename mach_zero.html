      const sideProjection = (e.x - targetState.x) * rightX + (e.z - targetState.z) * rightZ;
      const side = Math.abs(sideProjection) > 4 ? (sideProjection >= 0 ? 1 : -1) : e.orbitSign;
      e.evadeX = rightX * side * .88 + hx * .12;
      e.evadeZ = rightZ * side * .88 + hz * .12;
      e.evadeY = (e.y > targetState.y + 70 ? -.20 : (e.y < targetState.y - 70 ? .20 : (Math.random() < .5 ? -.24 : .24)));
      e.evadeT = R(.65, .95);
      e.gunEvadeCooldown = R(2.1, 2.8);
    }

    // Tactical phases: close an intercept, take a short firing window, then
    // reposition or extend to rebuild energy instead of endlessly orbiting.
    e.attackTimer -= dt;
    if (d > 1650 && e.attackPhase !== 'intercept') {
      e.attackPhase = 'intercept';
      e.attackTimer = R(2.2, 3.1);
    } else if (d < 270 && e.attackPhase !== 'extend' && e.evadeT <= 0) {
      e.attackPhase = 'extend';
      e.attackTimer = R(1.35, 1.9);
      e.orbitSign *= -1;
    } else if (e.attackPhase === 'extend' && e.attackTimer <= 0) {
      e.attackPhase = 'reposition';
      e.attackTimer = R(1.25, 1.8);
    } else if (e.attackPhase === 'intercept' && d < 1220 && noseAlignment > .68) {
      e.attackPhase = 'engage';
      e.attackTimer = R(1.7, 2.5);
    } else if (e.attackTimer <= 0) {
      if (e.attackPhase === 'engage') {
        e.attackPhase = 'reposition'; e.attackTimer = R(1.0, 1.55);
        e.orbitSign *= -1;
      } else if (e.attackPhase === 'reposition') {
        e.attackPhase = 'intercept'; e.attackTimer = R(2.0, 3.0);
      } else {
        e.attackTimer = R(1.5, 2.5);
      }
    }

    const horizontal = Math.hypot(px, pz) || 1;
    const sideX = -pz / horizontal * e.orbitSign;
    const sideZ = px / horizontal * e.orbitSign;
    const currentEnemySpeed = e.airSpeed || enemyV0;
    const leadCap = d > 1500 ? 2.2 : 1.35;
    const leadTime = cl(d / Math.max(240, currentEnemySpeed + targetState.speed), .22, leadCap);
    const leadX = targetState.x + targetState.vx * leadTime;
    const leadY = targetState.y + targetState.vy * leadTime;
    const leadZ = targetState.z + targetState.vz * leadTime;

    if (e.attackPhase === 'intercept') {
      // At long range, pursue the predicted flight path directly; only add a
      // small lateral offset as the merge approaches so the bandit cannot orbit wide.
      const offset = d > 1250 ? 0 : cl(d * .045, 35, 90);
      e.tx = leadX + sideX * offset;
      e.ty = cl(leadY + e.oy * .4 + cl(py * .045, -40, 40), 145, 980);
      e.tz = leadZ + sideZ * offset;
    } else if (e.attackPhase === 'engage') {
      const offset = cl(d * .075, 42, 112);
      e.tx = leadX + sideX * offset;
      e.ty = cl(leadY + e.oy * .2, 145, 980);
      e.tz = leadZ + sideZ * offset;
    } else if (e.attackPhase === 'reposition') {
      const offset = cl(d * .22, 240, 430);
      e.tx = leadX + sideX * offset - targetState.hx * 80;
      e.ty = cl(leadY + e.oy, 135, 1000);
      e.tz = leadZ + sideZ * offset - targetState.hz * 80;
    } else { // Extend away from the merge while building speed and stored energy.
      e.tx = e.x + hx * 560 + sideX * 170;
      e.ty = cl(e.y + e.oy * .12, 145, 1040);
      e.tz = e.z + hz * 560 + sideZ * 170;
    }
    if (e.tailDefenseT > 0) {
      if (e.tailDefenseMode === 'drag') {
        // Decelerate and cut across the pursuit line: a faster attacker may
        // overshoot, giving the bandit a brief chance to reverse the fight.
        e.tx = e.x + hx * 250 + sideX * 470;
        e.ty = cl(e.y + e.tailDefenseSide * 58 + e.oy * .10, 135, 1060);
        e.tz = e.z + hz * 250 + sideZ * 470;
      } else {
        // Use the energy advantage to climb/extend, then settle toward the
        // player's projected six-o'clock line rather than orbiting away.
        e.tx = leadX - targetState.hx * 390 + sideX * 150;
        e.ty = cl(leadY + 145 + e.oy * .08, 150, 1080);
        e.tz = leadZ - targetState.hz * 390 + sideZ * 150;
      }
    }
    if (e.evadeT > 0) {
      e.evadeT = Math.max(0, e.evadeT - dt);
      e.tx = e.x + e.evadeX * 690;
      e.ty = cl(e.y + e.evadeY * 300, 130, 1080);
      e.tz = e.z + e.evadeZ * 690;
    }

    // Own airspeed responds gradually to the tactical phase. High-G breaks
    // bleed energy; extending or flying smoothly lets the fighter recover it.
    const phaseSpeed = e.attackPhase === 'extend' ? 1.08 :
      (e.attackPhase === 'intercept' ? (d > 1300 ? 1.14 : 1.04) : .965);
    let desiredSpeed = cl(Math.max(130, targetState.speed * phaseSpeed + (e.aggressiveness - 1) * 15), 130, 260);
    let speedResponse = 19;
    if (e.tailDefenseT > 0 && e.tailDefenseMode === 'drag') {
      desiredSpeed = cl(targetState.speed - 34, 112, 152);
      speedResponse = 34;
    } else if (e.tailDefenseT > 0 && e.tailDefenseMode === 'extend') {
      desiredSpeed = cl(Math.max(targetState.speed + 34, e.airSpeed + 25), 190, 265);
      speedResponse = 25;
    }
    e.airSpeed = e.airSpeed || R(165, 188);
    e.airSpeed += cl(desiredSpeed - e.airSpeed, -speedResponse * dt, speedResponse * dt);

    const vl = Math.hypot(e.vx, e.vy, e.vz) || 1;
    const cx = e.vx / vl, cy2 = e.vy / vl, cz = e.vz / vl;
    let dx = e.tx - e.x, dy = e.ty - e.y, dz = e.tz - e.z;
    const dl = Math.hypot(dx, dy, dz) || 1;
    dx /= dl; dy /= dl; dz /= dl;
    const dot = cl(cx * dx + cy2 * dy + cz * dz, -1, 1);
    const nominalTurn = e.evadeT > 0 ? 1.18 :
      (e.attackPhase === 'engage' ? .82 : (e.attackPhase === 'extend' ? .62 : .76));
    const speedTurnFactorAI = cl(e.airSpeed / 180, .78, 1.12);
    const energyFactorAI = cl(.84 + (e.energy == null ? 1 : e.energy) * .16, .90, 1.02);
    const turnRate = nominalTurn * speedTurnFactorAI * energyFactorAI;
    e.maneuverLoad = cl((turnRate - .34) / .92, 0, 1);
    // Rotate on the shortest 3D arc. Linear interpolation between opposite
    // headings can stall or flip suddenly when the target crosses behind.
    const ang = Math.acos(dot);
    const step = Math.min(ang, turnRate * dt);
    let ax = cy2 * dz - cz * dy;
    let ay = cz * dx - cx * dz;
    let az = cx * dy - cy2 * dx;
    let al = Math.hypot(ax, ay, az);
    if (al < 1e-6) {
      const refX = Math.abs(cy2) < .85 ? 0 : 1;
      const refY = Math.abs(cy2) < .85 ? 1 : 0;
      ax = cy2 * 0 - cz * refY;
      ay = cz * refX - cx * 0;
      az = cx * refY - cy2 * refX;
      al = Math.hypot(ax, ay, az) || 1;
    }
    ax /= al; ay /= al; az /= al;
    const rc = Math.cos(step), rs = Math.sin(step), oneMinusRc = 1 - rc;
    const axisDot = ax * cx + ay * cy2 + az * cz;
    let nx = cx * rc + (ay * cz - az * cy2) * rs + ax * axisDot * oneMinusRc;
    let ny = cy2 * rc + (az * cx - ax * cz) * rs + ay * axisDot * oneMinusRc;
    let nz = cz * rc + (ax * cy2 - ay * cx) * rs + az * axisDot * oneMinusRc;
    if (e.y < 120) ny = Math.max(ny, .15 * Math.hypot(nx, nz));
    if (e.y > 1100) ny = Math.min(ny, -.1 * Math.hypot(nx, nz));
    const hn = Math.hypot(nx, nz) || 1;
    ny = cl(ny, -.5 * hn, .5 * hn);
    const nn = Math.hypot(nx, ny, nz) || 1;
    nx /= nn; ny /= nn; nz /= nn;

    const turnBleed = Math.pow(Math.max(0, turnRate - .58), 2) * 8.2;
    const minimumAIASpeed = e.tailDefenseT > 0 && e.tailDefenseMode === 'drag' ? 112 : 125;
    e.airSpeed = Math.max(minimumAIASpeed, e.airSpeed - turnBleed * dt);
    e.energy = cl((e.energy == null ? 1 : e.energy) +
      (turnRate > .88 ? -.14 : (e.attackPhase === 'extend' ? .105 : .045)) * dt, .62, 1.05);
    const enemySpeed = e.airSpeed;
    e.ax = (nx * enemySpeed - e.vx) / Math.max(dt, .001);
    e.az = (nz * enemySpeed - e.vz) / Math.max(dt, .001);
    e.vx = nx * enemySpeed; e.vy = ny * enemySpeed; e.vz = nz * enemySpeed;
    e.x += e.vx * dt; e.y += e.vy * dt; e.z += e.vz * dt;
    e.y = cl(e.y, 120, 1120);
    e.bank += (cl((e.ax * e.vz - e.az * e.vx) / Math.max(1, Math.hypot(e.vx, e.vz)) / 50, -1.2, 1.2) - e.bank) * Math.min(1, 3 * dt);

    if (e.tr <= 0) {
      e.tr = .06;
      addParticle({ x: e.x - e.vx * .1, y: e.y - e.vy * .1, z: e.z - e.vz * .1, vx: 0, vy: 0, vz: 0, l: .9, c: '#ffffff', k: 1 });
    }
    if (e.hp <= 2 && Math.random() < dt * 28) {
      addParticle({ x: e.x, y: e.y, z: e.z, vx: R(-4, 4), vy: R(2, 8), vz: R(-4, 4), l: R(.7, 1.2), c: '#2a2a2a', k: 1 });
    }

    // Recompute geometry after movement so locks and guns use current positions.
    const tx = targetState.x - e.x, ty = targetState.y - e.y, tz = targetState.z - e.z;
    const rangeNow = Math.hypot(tx, ty, tz) || 1;
    const ux = tx / rangeNow, uy = ty / rangeNow, uz = tz / rangeNow;
    const enemySpeedNow = Math.hypot(e.vx, e.vy, e.vz) || 1;
    const headingX = e.vx / enemySpeedNow, headingY = e.vy / enemySpeedNow, headingZ = e.vz / enemySpeedNow;
    const aimAlignment = headingX * ux + headingY * uy + headingZ * uz;
    const currentClosure = (e.vx - targetState.vx) * ux + (e.vy - targetState.vy) * uy + (e.vz - targetState.vz) * uz;

    // Both bandits carry the same six-shot rack and seeker. In 2v2 they split
    // targets; each aircraft can be threatened by one missile at a time.
    const inMissileEnvelope = e.spawnGrace <= 0 && rangeNow > 360 && rangeNow < 1850 &&
      aimAlignment > .915 && currentClosure > -28;
    if (inMissileEnvelope) {
      const lockRate = targetState.maneuverLoad > .62 ? .78 : 1.0;
      e.missileLock = Math.min(LT, e.missileLock + dt * lockRate);
    } else {
      e.missileLock = Math.max(0, e.missileLock - dt * 1.8);
    }
    if (e.missiles > 0 && e.missileCD <= 0 && e.missileLock >= LT) {
      launchEnemyMissile(e, targetAircraft);
    }

    // The same assigned target guides both the enemy's tactical pass and its guns.
    const gunTarget = {
      x:targetState.x, y:targetState.y, z:targetState.z,
      vx:targetState.vx, vy:targetState.vy, vz:targetState.vz,
      range:rangeNow, wingman:targetState.isWingman
    };
    const gunLeadTime = cl(gunTarget.range / (enemySpeedNow + 420), 0, .85);
    const aimX = gunTarget.x + gunTarget.vx * gunLeadTime;
    const aimY = gunTarget.y + gunTarget.vy * gunLeadTime;
    const aimZ = gunTarget.z + gunTarget.vz * gunLeadTime;
    const gx = aimX - e.x, gy = aimY - e.y, gz = aimZ - e.z;
    const gl = Math.hypot(gx, gy, gz) || 1;
    const gunAlignment = headingX * (gx / gl) + headingY * (gy / gl) + headingZ * (gz / gl);
    const gunClosure = ((e.vx - gunTarget.vx) * gx + (e.vy - gunTarget.vy) * gy + (e.vz - gunTarget.vz) * gz) / gl;
    const inGunEnvelope = e.spawnGrace <= 0 && gunTarget.range < 850 && gunAlignment > .945 && gunClosure > -145;
    if (!e.gunOverheated) {
      e.gunHeat = Math.max(0, e.gunHeat - (inGunEnvelope ? GUN_COOL_WHILE_FIRING : GUN_COOL_RATE) * dt);
    }
    e.sh -= dt;
    if (inGunEnvelope && e.sh <= 0 && !e.gunOverheated) {
      e.sh = .12 + R(0, .07);
      const spread = 14 + (1 - gunAlignment) * 90;
      const ax = aimX + R(-spread, spread);
      const ay = aimY + R(-spread, spread);
      const az = aimZ + R(-spread, spread);
      const ddx = ax - e.x, ddy = ay - e.y, ddz = az - e.z;
      const dl2 = Math.hypot(ddx, ddy, ddz) || 1;
      const bulletSpeed = enemySpeedNow + 420;
      bl.push({
        x: e.x, y: e.y, z: e.z,
        vx: ddx / dl2 * bulletSpeed, vy: ddy / dl2 * bulletSpeed, vz: ddz / dl2 * bulletSpeed,
        l: 1.55, e: 1
      });
      if (e.gunSoundCD <= 0) {
        const sideX = e.x - P.x, sideZ = e.z - P.z;
        const pan = cl((sideX * Math.cos(yaw) - sideZ * Math.sin(yaw)) / (Math.hypot(sideX, sideZ) || 1), -1, 1);
        SFX.playCannonPulse(gunTarget.range, pan, gunTarget.wingman ? 0.28 : 0.32);
        e.gunSoundCD = 0.19;
      }
      e.gunHeat = Math.min(GUN_HEAT_MAX, e.gunHeat + GUN_HEAT_PER_SHOT);
      if (e.gunHeat >= GUN_HEAT_MAX) e.gunOverheated = true;
    }
  }

  // Wingman AI: hold a loose echelon station, turn smoothly, and engage the
  // nearest live bandit with short cannon bursts. It is deliberately a support
  // fighter, not an invulnerable extra player.
  for (const w of wingmen) {
    if (w.dead) continue;
    w.hit = Math.max(0, (w.hit || 0) - dt * 6);
    w.gunCD = Math.max(0, w.gunCD - dt);
    w.gunSoundCD = Math.max(0, (w.gunSoundCD || 0) - dt);
    w.missileCD = Math.max(0, w.missileCD - dt);
    w.flareCooldown = Math.max(0, (w.flareCooldown || 0) - dt);
    if (w.missiles === 0) {
      w.missileRecharge += dt;
      if (w.missileRecharge >= MISSILE_RACK_RELOAD_SECONDS) { w.missiles = 6; w.missileRecharge = 0; }
    } else w.missileRecharge = 0;
    if (w.flareCount === 0) {
      w.flareRecharge += dt;
      if (w.flareRecharge >= FLARE_RACK_RELOAD_SECONDS) { w.flareCount = FLARE_MAX; w.flareRecharge = 0; }
    } else w.flareRecharge = 0;
    w.gunHeat = Math.max(0, (w.gunHeat || 0) - (w.gunOverheated ? GUN_OVERHEAT_COOL : GUN_COOL_RATE) * dt);
    if (w.gunOverheated && w.gunHeat <= 28) w.gunOverheated = false;
    const target = chooseWingmanEngagementTarget(w);
    const desired = target ? {
      x: target.e.x + target.e.vx * .45,
      y: target.e.y + target.e.vy * .45,
      z: target.e.z + target.e.vz * .45
    } : {
      x: P.x - Math.cos(yaw) * 95 + Math.sin(yaw) * 45,
      y: P.y + 24,
      z: P.z + Math.sin(yaw) * 95 + Math.cos(yaw) * 45
    };
    if (!target) {
      desired.x = P.x - Math.cos(yaw) * 115 + Math.sin(yaw) * 50;
      desired.y = P.y + 25;
      desired.z = P.z + Math.sin(yaw) * 115 + Math.cos(yaw) * 50;
    }
    const wingStateBeforeTurn = friendlyAircraftState(w);
    if (target) {
      const rx = target.e.x - w.x, ry = target.e.y - w.y, rz = target.e.z - w.z;
      const range = Math.hypot(rx, ry, rz) || 1;
      const alignment = (wingStateBeforeTurn.hx * rx + wingStateBeforeTurn.hy * ry + wingStateBeforeTurn.hz * rz) / range;
      if (range > 360 && range < 1650 && alignment > .925) {
        w.missileLock = Math.min(LT, w.missileLock + dt * (w.maneuverLoad > .62 ? .78 : 1));
        w.lockTarget = target.e;
      } else {
        w.missileLock = Math.max(0, w.missileLock - dt * 1.8);
        if (w.missileLock <= 0) w.lockTarget = null;
      }
      if (w.missiles > 0 && w.missileCD <= 0 && w.missileLock >= LT) launchWingmanMissile(w, target.e);
    } else {
      w.missileLock = Math.max(0, w.missileLock - dt * 1.8);
      if (w.missileLock <= 0) w.lockTarget = null;
    }
    const vl = Math.hypot(w.vx, w.vy, w.vz) || 1;
    let hx = w.vx / vl, hy = w.vy / vl, hz = w.vz / vl;
    const dx = desired.x - w.x, dy = desired.y - w.y, dz = desired.z - w.z;
    const dl = Math.hypot(dx, dy, dz) || 1;
    const tx = dx / dl, ty = dy / dl, tz = dz / dl;
    const dot = cl(hx * tx + hy * ty + hz * tz, -1, 1);
    const angle = Math.acos(dot);
    const cx = hy * tz - hz * ty, cy = hz * tx - hx * tz, cz = hx * ty - hy * tx;
    let axisLen = Math.hypot(cx, cy, cz);
    let ax = cx, ay = cy, az = cz;
    if (axisLen < 1e-6 && dot < 0) {
      // Deterministic level-turn axis for the exactly-opposite case.
      ax = -hz; ay = 0; az = hx; axisLen = Math.hypot(ax, ay, az) || 1;
    }
    if (axisLen > 1e-6 && angle > 1e-4) {
      ax /= axisLen; ay /= axisLen; az /= axisLen;
      const step = Math.min(angle, 1.05 * cl(w.airSpeed / 180, .8, 1.12) * dt);
      w.maneuverLoad = cl(step / Math.max(dt, .001) / 1.05, 0, 1);
      const c = Math.cos(step), sn = Math.sin(step), ad = ax * hx + ay * hy + az * hz;
      const nx = hx * c + (ay * hz - az * hy) * sn + ax * ad * (1 - c);
      const ny = hy * c + (az * hx - ax * hz) * sn + ay * ad * (1 - c);
      const nz = hz * c + (ax * hy - ay * hx) * sn + az * ad * (1 - c);
      const nl = Math.hypot(nx, ny, nz) || 1;
      hx = nx / nl; hy = ny / nl; hz = nz / nl;
    }
    w.airSpeed += cl((target ? 205 : speed) - w.airSpeed, -22 * dt, 22 * dt);
    w.vx = hx * w.airSpeed; w.vy = hy * w.airSpeed; w.vz = hz * w.airSpeed;
    w.x += w.vx * dt; w.y = cl(w.y + w.vy * dt, 130, 1100); w.z += w.vz * dt;
    w.bank += (cl((hx * (w.vy || 0) - hy * w.vx) / 180, -1, 1) - w.bank) * Math.min(1, 2 * dt);
    if (target && target.d < 1050) {
      const rx = target.e.x - w.x, ry = target.e.y - w.y, rz = target.e.z - w.z;
      const rl = Math.hypot(rx, ry, rz) || 1;
      const aim = (w.vx * rx + w.vy * ry + w.vz * rz) / (w.airSpeed * rl);
      if (aim > .955 && w.gunCD <= 0 && !w.gunOverheated) {
        const bulletSpeed = w.airSpeed + 420;
        const spread = 5 + (1 - aim) * 80;
        const ax = rx + R(-spread, spread), ay = ry + R(-spread, spread), az = rz + R(-spread, spread);
        const al = Math.hypot(ax, ay, az) || 1;
        bl.push({ x:w.x, y:w.y, z:w.z,
          vx:ax / al * bulletSpeed, vy:ay / al * bulletSpeed, vz:az / al * bulletSpeed,
          l:1.2, e:0, friendly:true });
        w.gunHeat = Math.min(GUN_HEAT_MAX, (w.gunHeat || 0) + GUN_HEAT_PER_SHOT);
        if (w.gunHeat >= GUN_HEAT_MAX) w.gunOverheated = true;
        if (w.gunSoundCD <= 0) {
          const sideX = w.x - P.x, sideZ = w.z - P.z;
          const pan = cl((sideX * Math.cos(yaw) - sideZ * Math.sin(yaw)) / (Math.hypot(sideX, sideZ) || 1), -1, 1);
          SFX.playCannonPulse(Math.hypot(sideX, w.y - P.y, sideZ), pan, 0.22);
          w.gunSoundCD = .22;
        }
        w.gunCD = .095;
      }
    }
  }

  // Wingman countermeasures are finite and use the same seeker discrimination as the player's.
  for (const w of wingmen) {
    if (w.dead || w.flareCount <= 0 || w.flareCooldown > 0) continue;
    const threat = incomingMissiles.find(m => m.life > 0 && m.targetRef === w && !m.flareTarget);
    if (!threat) continue;
    const stateNow = friendlyAircraftState(w);
    const range = Math.hypot(stateNow.engine.x - threat.x, stateNow.engine.y - threat.y, stateNow.engine.z - threat.z);
    if (range < 1050) releaseWingmanFlares(w);
  }

  // Hostile seekers follow their assigned aircraft. The two bandits split
  // their missile locks, while either target can defeat a shot with flares or a turn.
  let nearestThreat = Infinity, nearestClosure = 0;
  for (const missile of incomingMissiles) {
    missile.age += dt;
    missile.life -= dt;
    if (missile.life <= 0) continue;
    const targetAircraft = missile.targetRef || P;
    if (targetAircraft !== P && targetAircraft.dead) { missile.life = 0; continue; }
    const targetState = friendlyAircraftState(targetAircraft);
    const targetEngine = targetState.engine;
    const targetRange = Math.hypot(targetEngine.x - missile.x, targetEngine.y - missile.y, targetEngine.z - missile.z);
    const targetFlares = targetState.isWingman ? wingmanFlares : flares;
    const targetSignature = .42 + .58 * engineHeatSignature(targetState.speed);
    tryAcquireFlare(missile, targetFlares, targetEngine, targetRange, targetSignature, dt);

    const decoy = missile.flareTarget && missile.flareTarget.life > 0 ? missile.flareTarget : null;
    if (!decoy) missile.flareTarget = null;
    const enginePoint = decoy ? decoy : targetEngine;
    const rangeToAim = Math.hypot(enginePoint.x - missile.x, enginePoint.y - missile.y, enginePoint.z - missile.z) || 1;
    const lead = decoy ? 0 : cl(rangeToAim / ((missile.speed || 300) + targetState.speed), 0, .58);
    const aimPoint = decoy ? enginePoint : {
      x: enginePoint.x + targetState.vx * lead,
      y: enginePoint.y + targetState.vy * lead,
      z: enginePoint.z + targetState.vz * lead
    };
    const oldX = missile.x, oldY = missile.y, oldZ = missile.z;
    if (!decoy && missile.age > .16 && missileHasPassedTarget(missile, enginePoint, targetState.vx, targetState.vy, targetState.vz, 190)) {
      missile.life = 0;
      continue;
    }
    guideMissile(missile, aimPoint, dt, decoy ? 0 : targetState.maneuverLoad, !!decoy, decoy ? 1.05 : targetSignature);
    missile.x += missile.vx * dt; missile.y += missile.vy * dt; missile.z += missile.vz * dt;

    if (decoy && segmentPointDistance(oldX, oldY, oldZ, missile.x, missile.y, missile.z, decoy.x, decoy.y, decoy.z) < 15) {
      decoy.life = 0; missile.life = 0;
      boom(missile.x, missile.y, missile.z, 12, false);
      continue;
    }
    const targetDistance = Math.hypot(targetState.x - missile.x, targetState.y - missile.y, targetState.z - missile.z);
    const rx = targetState.x - missile.x, ry = targetState.y - missile.y, rz = targetState.z - missile.z;
    const rlen = targetDistance || 1;
    const ux = rx / rlen, uy = ry / rlen, uz = rz / rlen;
    const closure = missile.vx * ux + missile.vy * uy + missile.vz * uz -
      (targetState.vx * ux + targetState.vy * uy + targetState.vz * uz);
    if (targetDistance < nearestThreat) { nearestThreat = targetDistance; nearestClosure = closure; }
    const sweptDistance = segmentPointDistance(oldX, oldY, oldZ, missile.x, missile.y, missile.z,
      targetState.x, targetState.y, targetState.z);
    if (sweptDistance < 18) {
      missile.life = 0;
      if (targetState.isWingman) {
        const w = targetAircraft;
        w.hp = Math.max(0, (w.hp || 100) - MISSILE_HULL_DAMAGE);
        w.hit = 1;
        impactFeedbackT = impactFeedbackMax;
        boom(w.x, w.y, w.z, 34, true);
        if (w.hp <= 0) {
          w.dead = true;
          msgT = 1.8; msgS = 'ALLY DOWN';
        }
        SFX.playMissileHitAlert();
      } else {
        applyPlayerMissileHit();
      }
      continue;
    }
    if (!decoy && targetDistance < 300 && closure < -45) missile.overshootT = (missile.overshootT || 0) + dt;
    else missile.overshootT = Math.max(0, (missile.overshootT || 0) - dt * 1.5);
    if (!decoy && missile.overshootT > .18) {
      if (targetState.maneuverLoad > .30 && targetState.speed > 150) {
        score += targetState.isWingman ? 0 : 20;
        msgT = 1.25; msgS = targetState.isWingman ? 'WINGMAN OUTTURNED MISSILE' : 'MISSILE OUTTURNED  +20';
      }
      missile.life = 0;
    }
  }
  incomingMissiles = incomingMissiles.filter(m => m.life > 0);
  SFX.updateMissileWarning(dt, nearestThreat, nearestClosure);

  let liveFlares = 0;
  for (let i = 0; i < flares.length; i++) {
    const flare = flares[i];
    flare.age += dt; flare.life -= dt; flare.trailT -= dt;
    flare.x += flare.vx * dt; flare.y += flare.vy * dt; flare.z += flare.vz * dt;
    flare.vy -= 5 * dt;
    if (flare.trailT <= 0 && flare.life > 0) {

// Volumetric cloud billboards are baked once into small transparent textures.
// This gives soft multi-lobed shading at a fraction of the cost of per-frame gradients.
function buildCloudSprites() {
  // One-time fractal cloud textures: low-frequency mass plus smaller-scale
  // weather texture makes the silhouette irregular without visible round puffs.
  const styles = [
    { top: 69, base: 142, amp: 12, seed: 11 }, // broad stratocumulus
    { top: 47, base: 148, amp: 24, seed: 23 }, // broken cumulus
    { top: 91, base: 139, amp: 7,  seed: 37 }, // low layered sheet
    { top: 31, base: 153, amp: 31, seed: 49 }, // taller congestus
    { top: 61, base: 140, amp: 18, seed: 61 }, // scattered middle cloud
    { top: 101,base: 135, amp: 5,  seed: 73 }, // thin high veil
    { top: 18, base: 156, amp: 42, seed: 85 }, // towering cumulus
    { top: 82, base: 145, amp: 26, seed: 97 }  // broken, wind-sheared bank
  ];
  const smooth = (a, b, v) => { const t = cl((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  return styles.map((st, index) => {
    const c = document.createElement('canvas'); c.width = 384; c.height = 180;
    const g = c.getContext('2d');
    const img = g.createImageData(c.width, c.height), data = img.data;
    const hash = (x, y) => {
      const n = Math.sin((x * 127.1 + y * 311.7 + st.seed * 74.7) * .017) * 43758.5453;
      return n - Math.floor(n);
    };
    const noise = (x, y, cell) => {
      const gx = x / cell, gy = y / cell, ix = Math.floor(gx), iy = Math.floor(gy);
      const fx0 = gx - ix, fy0 = gy - iy;
      const fx = fx0 * fx0 * (3 - 2 * fx0), fy = fy0 * fy0 * (3 - 2 * fy0);
      const a = hash(ix, iy), b = hash(ix + 1, iy), d = hash(ix, iy + 1), e = hash(ix + 1, iy + 1);
      const u = a + (b - a) * fx, v = d + (e - d) * fx;
      return u + (v - u) * fy;
    };
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        const u = x / (c.width - 1);
        const n1 = noise(x, y, 68), n2 = noise(x + 37, y + 19, 27), n3 = noise(x - 13, y + 47, 10), n4 = noise(x + 53, y - 29, 5);
        const envelope = Math.pow(Math.max(0, Math.sin(Math.PI * u)), .58);
        const broad = Math.sin(u * 6.0 + index * .8) * st.amp * .34 +
          Math.sin(u * 15.0 + index * 1.3) * st.amp * .20;
        const broken = (n1 - .5) * 10 + (n2 - .5) * 6.5 + (n3 - .5) * 3.6 + (n4 - .5) * 2.8;
        let topY = st.base - (st.base - st.top - broad) * envelope + broken;
        if (index === 1 || index === 3 || index === 6 || index === 7) {
          const lobeA = Math.pow(Math.max(0, Math.sin(u * (index === 6 ? 13.5 : 10.5) + index)), 2);
          const lobeB = Math.pow(Math.max(0, Math.sin(u * 5.4 + index * .7)), 2);
          topY -= (lobeA * .30 + lobeB * .16) * st.amp * envelope;
        }
        const bottomY = st.base + Math.sin(u * 8.3 + index) * 5.2 + (n2 - .5) * 5 + (n4 - .5) * 2.5 + (1 - envelope) * 4;
        const edge = Math.min(y - topY + broken, bottomY - y + broken * .45);
        const horizontal = smooth(0, 10, Math.min(x, c.width - 1 - x));
        const coverage = smooth(-7, 13, edge) * horizontal;
        if (coverage <= .008) continue;
        const v = cl((y - topY) / Math.max(1, bottomY - topY), 0, 1);
        const texture = (n1 - .5) * 7 + (n2 - .5) * 11 + (n3 - .5) * 9;
        const underside = smooth(.43, 1, v);
        const topRim = Math.exp(-Math.max(0, y - topY) / 7.5) * (1 - underside * .45);
        const alpha = cl(coverage * (.82 + .18 * (.6 * n1 + .3 * n2 + .1 * n3)), 0, 1);
        const i = (y * c.width + x) * 4;
        data[i] = cl(247 - v * 78 + texture - underside * 9 + topRim * 8, 0, 255);
        data[i + 1] = cl(251 - v * 71 + texture - underside * 11 + topRim * 9, 0, 255);
        data[i + 2] = cl(255 - v * 55 + texture - underside * 9 + topRim * 10, 0, 255);
        data[i + 3] = Math.round(alpha * 255);
      }
    }
    g.putImageData(img, 0, 0);
    // Delicate internal billow streaks and wisps, baked into the sprite.
    let seed = 331 + st.seed * 19;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    g.save(); g.lineCap = 'round'; g.globalCompositeOperation = 'screen';
    for (let i = 0; i < 22; i++) {
      const x = 22 + rnd() * 340, y = 82 + rnd() * 42, len = 12 + rnd() * 48;
      g.strokeStyle = `rgba(255,255,255,${.025 + rnd() * .07})`;
      g.lineWidth = .8 + rnd() * 2.2;
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + len * .46, y - 3 - rnd() * 5, x + len, y + (rnd() - .5) * 3); g.stroke();
    }
    g.restore();
    // Underside blue-grey is already encoded in the pixel gradient above, so
    // no unmasked overlay is drawn; this avoids any rectangular texture halo.
    return c;
  });
}

function getJetBasis(yw, ptch, rll) {
  const cp = Math.cos(ptch), sp = Math.sin(ptch), sy = Math.sin(yw), cy = Math.cos(yw);
  const fx = sy * cp, fy = sp, fz = cy * cp;
  const rx = cy, rz = -sy;
  const ux = -sy * sp, uy = cp, uz = -cy * sp;
  const cb = Math.cos(rll), sb = Math.sin(rll);

    R: [rx * cb - ux * sb, -uy * sb, rz * cb - uz * sb],
    U: [ux * cb + rx * sb, uy * cb, uz * cb + rz * sb],
    F: [fx, fy, fz]
  };
}
