      for (let j = 0; j < 5; j++) {
        const x = side * (2.9 + j * .48);
        localFastener(x, .18 - j*.018, -1.5 - j*.46);
      }
    }
    // Fine panel lips along the chine and small forward inspection fasteners.
    localStroke([[-.60,.50,6.95],[-.82,.43,5.62],[-1.05,.34,4.42]], 'rgba(211,225,238,.56)', .58, .68);
    localStroke([[.60,.50,6.95],[.82,.43,5.62],[1.05,.34,4.42]], 'rgba(211,225,238,.56)', .58, .68);
    for (const side of [-1, 1]) {
      localFastener(side*.68,.47,6.9); localFastener(side*1.04,.33,4.8);
      localFastener(side*1.48,.23,2.2); localFastener(side*1.92,.19,-.1);
    }
    // Small heat-shield seams and louver cuts at the twin engine shoulders.
    for (let i = 0; i < 5; i++) {
      const z = -5.2 - i*.31;
      localStroke([[-1.18,.64,z],[-.88,.76,z-.05],[-.58,.78,z-.08]], 'rgba(15,24,36,.84)', .54, .72);
      localStroke([[1.18,.64,z],[.88,.76,z-.05],[.58,.78,z-.08]], 'rgba(15,24,36,.84)', .54, .72);
    }
  }

  // Animated boundary-layer flow over the delta wings. Fine streamlines remain
  // attached to the wing surface while short bright packets travel aft; G-load
  // increases the local condensation without turning the wings into white rails.
  const wingLoad = cl((Math.hypot(ctrlX, ctrlY) - .20) / .78, 0, 1) * cl((speed - 78) / 120, 0, 1);
  const flowSpeed = cl((speed - 72) / 188, 0, 1);
  const flowActivity = flowSpeed * (.22 + wingLoad * .78);
  if (flowActivity > .035) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = 'screen';
    const flowPath = (side, span, from, to) => {
      ctx.beginPath();
      let valid = true, depth = 0;
      const steps = 16;
      for (let j = 0; j <= steps; j++) {
        const t = from + (to - from) * j / steps;
        const leadZ = 1.28 - span * 6.05;
        const chord = 3.75 - span * 1.05;
        const ripple = Math.sin(tick * 5.3 + span * 13 + side * 1.7 + t * 9) * (.018 + wingLoad * .035);
        const lx = side * (1.82 + span * 4.95 + ripple);
        const ly = .19 + Math.sin(t * Math.PI) * (.055 + wingLoad * .06) + Math.sin(tick * 4.1 + span * 8) * .012;
        const lz = leadZ - t * chord;
        const q = proj(
          P.x + R3[0] * lx + U3[0] * ly + F3[0] * lz,
          P.y + R3[1] * lx + U3[1] * ly + F3[1] * lz,
          P.z + R3[2] * lx + U3[2] * ly + F3[2] * lz
        );
        if (q.z < 3) { valid = false; break; }
        depth += q.z;
        if (j === 0) ctx.moveTo(q.sx, q.sy); else ctx.lineTo(q.sx, q.sy);
      }
      return valid ? { depth: depth / (steps + 1) } : null;
    };
    for (const side of [-1, 1]) {
      for (let ribbon = 0; ribbon < 5; ribbon++) {
        const span = .13 + ribbon * .175;
        const base = flowPath(side, span, 0, 1);
        if (base) {
          ctx.globalAlpha = .20 + flowActivity * .30;
          ctx.strokeStyle = 'rgba(205,229,238,.52)';
          ctx.lineWidth = cl(.095 * F / base.depth, .48, 1.05);
          ctx.stroke();

          // A compact moving condensation packet makes the air visibly travel
          // from the leading edge to the trailing edge rather than sit still.
          const phase = ((tick * (.34 + flowSpeed * .48) + ribbon * .193 + (side > 0 ? .11 : 0)) % 1 + 1) % 1;
          const packetEnd = Math.min(.99, phase + .19);
          if (packetEnd > phase + .025) {
            const packet = flowPath(side, span, phase, packetEnd);
            if (packet) {
              ctx.globalAlpha = (.13 + flowActivity * .48) * (1 - ribbon * .055);
              ctx.strokeStyle = 'rgba(236,249,255,.88)';
              ctx.lineWidth = cl(.15 * F / packet.depth, .58, 1.45);
              ctx.stroke();
            }
          }
        }
      }

      // A weak rolling tip vortex only condenses under meaningful lift loading.
      if (wingLoad > .18) {
        const tip = proj(
          P.x + R3[0] * (side * 7.0) + U3[0] * .08 + F3[0] * -4.3,
          P.y + R3[1] * (side * 7.0) + U3[1] * .08 + F3[1] * -4.3,
          P.z + R3[2] * (side * 7.0) + U3[2] * .08 + F3[2] * -4.3
        );
        if (tip.z > 3) {
          const r = cl(2.0 * F / tip.z, .65, 3.8);
          ctx.globalAlpha = .08 + wingLoad * .18;
          disc(tip.sx, tip.sy, r * 1.45, r * .72, 'rgba(220,243,250,.7)');
        }
      }
    }
    ctx.restore();
  }

  // Machined twin nozzle petals with a layered exhaust plume. The plume length,
  // core luminance and turbulent edge flicker all follow aircraft speed/power.
  const enginePower = cl((speed - 78) / 182, 0, 1);
  for (let nozzleIndex = 0; nozzleIndex < 2; nozzleIndex++) {
    const nxOff = nozzleIndex === 0 ? -0.82 : 0.82;
    const flicker = .86 + .085 * Math.sin(tick * 21.5 + nozzleIndex * 1.8) + .055 * Math.sin(tick * 43 + nozzleIndex * 2.7);
    const nozzlePoint = proj(
      P.x + R3[0] * nxOff + U3[0] * .18 - F3[0] * 10.15,
      P.y + R3[1] * nxOff + U3[1] * .18 - F3[1] * 10.15,
      P.z + R3[2] * nxOff + U3[2] * .18 - F3[2] * 10.15
    );
    const plumeLength = 2.0 + enginePower * (4.5 + flicker * .7);
    const plumeTip = proj(
      P.x + R3[0] * nxOff + U3[0] * .18 - F3[0] * (10.15 + plumeLength),
      P.y + R3[1] * nxOff + U3[1] * .18 - F3[1] * (10.15 + plumeLength),
      P.z + R3[2] * nxOff + U3[2] * .18 - F3[2] * (10.15 + plumeLength)
    );
    if (nozzlePoint.z <= 4 || plumeTip.z <= 4) continue;

    const rNoz = Math.max(1.2, .52 * F / nozzlePoint.z);
    // Dark titanium exhaust ring and individually separated convergent petals.
    disc(nozzlePoint.sx, nozzlePoint.sy, rNoz * 1.27, rNoz * 1.08, '#171e27');
    ctx.save();
    ctx.strokeStyle = 'rgba(174,190,204,.78)';
    ctx.lineWidth = Math.max(.55, rNoz * .105);
    ctx.beginPath(); ctx.ellipse(nozzlePoint.sx, nozzlePoint.sy, rNoz * 1.16, rNoz * .96, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(87,104,122,.95)';
    ctx.lineWidth = Math.max(.45, rNoz * .075);
    ctx.beginPath(); ctx.ellipse(nozzlePoint.sx, nozzlePoint.sy, rNoz * .78, rNoz * .65, 0, 0, Math.PI * 2); ctx.stroke();
    for (let petal = 0; petal < 8; petal++) {
      const a = petal * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(nozzlePoint.sx + Math.cos(a) * rNoz * .73, nozzlePoint.sy + Math.sin(a) * rNoz * .60);
      ctx.lineTo(nozzlePoint.sx + Math.cos(a + .13) * rNoz * 1.08, nozzlePoint.sy + Math.sin(a + .13) * rNoz * .86);
      ctx.stroke();
    }
    ctx.restore();

    const dx = plumeTip.sx - nozzlePoint.sx, dy = plumeTip.sy - nozzlePoint.sy;
    const plumePx = Math.hypot(dx, dy);
    if (plumePx < .6) continue;
    const angle = Math.atan2(dy, dx);
    const width = cl(rNoz * (.26 + enginePower * .43) * flicker, .55, 10);
    const brightness = .09 + Math.pow(enginePower, .82) * .82;
    ctx.save();
    ctx.translate(nozzlePoint.sx, nozzlePoint.sy);
    ctx.rotate(angle);
    ctx.globalCompositeOperation = 'lighter';

    // Soft exhaust bloom is kept close to the nozzle so it does not wash out the jet.
    const bloom = ctx.createRadialGradient(width * .25, 0, .1, width * .25, 0, width * (1.2 + enginePower * .65));
    bloom.addColorStop(0, `rgba(115,190,255,${brightness * .28})`);
    bloom.addColorStop(.36, `rgba(255,171,86,${brightness * .19})`);
    bloom.addColorStop(1, 'rgba(255,110,48,0)');
    ctx.fillStyle = bloom;
    ctx.beginPath(); ctx.ellipse(width * .25, 0, width * (1.2 + enginePower * .65), width * .82, 0, 0, Math.PI * 2); ctx.fill();

    // Outer turbulent envelope: a gently wavering plume, not a rigid triangle.
    ctx.globalAlpha = .30 + brightness * .47;
    ctx.fillStyle = enginePower > .52 ? 'rgba(255,139,58,.62)' : 'rgba(94,174,226,.38)';
    ctx.beginPath();
    ctx.moveTo(0, -width * .48);
    ctx.bezierCurveTo(plumePx * .16, -width * .78, plumePx * .48, -width * (.43 + .07 * flicker), plumePx, 0);
    ctx.bezierCurveTo(plumePx * .54, width * (.31 + .06 * flicker), plumePx * .16, width * .70, 0, width * .48);
    ctx.closePath(); ctx.fill();

    // The hotter inner column has a blue-white root and a warmer afterburning core.
    ctx.globalAlpha = .25 + brightness * .72;
    const core = ctx.createLinearGradient(0, 0, plumePx, 0);
    core.addColorStop(0, `rgba(190,229,255,${.42 + brightness * .38})`);
    core.addColorStop(.16, `rgba(255,244,207,${.30 + brightness * .55})`);
    core.addColorStop(.48, `rgba(255,184,91,${.22 + brightness * .43})`);
    core.addColorStop(1, 'rgba(255,132,55,0)');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.moveTo(0, -width * .20);
    ctx.bezierCurveTo(plumePx * .22, -width * .34, plumePx * .60, -width * .16, plumePx * .92, 0);
    ctx.bezierCurveTo(plumePx * .60, width * .15, plumePx * .22, width * .29, 0, width * .20);
    ctx.closePath(); ctx.fill();

    // Three faint shock diamonds appear as pressure cells in the expanding jet.
    ctx.strokeStyle = `rgba(255,229,180,${.08 + brightness * .29})`;
    ctx.lineWidth = cl(width * .10, .45, 1.15);
    for (let cell = 0; cell < 3; cell++) {
      const x = plumePx * (.23 + cell * .22);
      const half = width * (.48 - cell * .07);
      const len = plumePx * .045;
      ctx.beginPath();
      ctx.moveTo(x - len, 0); ctx.lineTo(x, -half); ctx.lineTo(x + len, 0); ctx.lineTo(x, half); ctx.closePath(); ctx.stroke();
    }
    // A narrow bright filament flickers inside the core at high output.
    ctx.globalAlpha = .12 + brightness * .42;
    ctx.strokeStyle = '#fff1cf';
    ctx.lineWidth = cl(width * .12, .45, 1.2);
    ctx.beginPath(); ctx.moveTo(width * .12, 0); ctx.lineTo(plumePx * (.58 + .025 * Math.sin(tick * 18 + nozzleIndex)), 0); ctx.stroke();
    ctx.restore();
  }

}

// Draw each wake as a tapered, fading filament. Two layered strokes give it
// a soft condensation edge without the disconnected white dots of the old effect.
function drawWingVortexTrails() {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const stream of wingTrails) {
    for (let i = 1; i < stream.length; i++) {
      const a = stream[i - 1], b = stream[i];
      const pa = proj(a.x, a.y, a.z), pb = proj(b.x, b.y, b.z);
      if (pa.z <= 3 || pb.z <= 3) continue;
      const fade = cl((a.life + b.life) / (a.maxLife + b.maxLife), 0, 1);
      const strength = Math.min(a.strength, b.strength);
      const alpha = fade * strength;
      const scale = F / ((pa.z + pb.z) * .5);
      ctx.strokeStyle = `rgba(213,239,255,${alpha * .18})`;
      ctx.lineWidth = cl(.62 * scale, .7, 4.2);
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
      ctx.strokeStyle = `rgba(246,252,255,${alpha * .62})`;
      ctx.lineWidth = cl(.13 * scale, .55, 1.35);
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
    }
  }
  ctx.restore();
}

// ============================================================================
// 8. TERRAIN, OCEAN, CLOUDS & HUD RENDERING
// ============================================================================
function drawIsland(o) {
  const wx = camX + wrap(o.x - camX), wz = camZ + wrap(o.z - camZ), c = proj(wx, 0, wz);
  if (c.z < o.r * .72 || c.z > 3600 || Math.abs(c.sx) > W * 1.15) return;
  const t = Math.min(.78, c.z / 4200);
  const poly = (scale, color, outline = null, lineWidth = .8) => {
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2, r = o.r * scale * o.sh[i];
      const p = proj(wx + Math.cos(a) * r, 0, wz + Math.sin(a) * r);
      if (p.z < 10) return;
      i ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy);
    }
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    if (outline) { ctx.strokeStyle = outline; ctx.lineWidth = lineWidth; ctx.stroke(); }
  };

  // Turquoise reef shelf, pale surf line and warm sand ring.
  poly(1.72, 'rgba(65,177,177,.20)');
  poly(1.37, rgb([128,164,145], .95, t));
  poly(1.22, rgb([199,185,143], 1, t), 'rgba(226,231,206,.52)', .8);
  poly(1.08, rgb([218,205,165], 1, t));
  poly(.91, rgb([83,137,78], 1, t), 'rgba(45,92,57,.48)', .65);
  poly(.72, rgb([65,116,69], 1, t));

  // Forest canopy patches give the islands scale and a less synthetic surface.
  if (c.z < 1900) {
    for (let i = 0; i < o.forest.length; i++) {
      const f = o.forest[i], fp = proj(wx + f.ox, 2.2, wz + f.oz);
      if (fp.z < 8) continue;
      const r = cl(f.size * F / fp.z, .35, 4.8);
      const col = f.tone > 1 ? 'rgba(47,104,58,.62)' : 'rgba(39,88,54,.58)';
      disc(fp.sx, fp.sy, r * 1.55, r * .62, col);
      if (r > 1.25) disc(fp.sx - r*.2, fp.sy - r*.18, r*.65, r*.34, 'rgba(126,157,91,.25)');
    }
  }

  // Low hills use lit facets; the brighter upper faces suggest exposed rock and grass.
  for (const h of o.hills) {
    const hx = wx + h.ox, hz = wz + h.oz, K = 9, pk = proj(hx, h.h, hz);
    if (pk.z < 10 || pk.z > 3600) continue;
    const rg = (r, y, i) => { const a = i / K * Math.PI * 2; return proj(hx + Math.cos(a) * r, y, hz + Math.sin(a) * r); };
    for (let i = 0; i < K; i++) {
      const th = (i + .5) / K * Math.PI * 2, nx = Math.cos(th), nz = Math.sin(th);
      if ((camX - hx) * nx + (camZ - hz) * nz <= 0) continue;
      const lit = cl((nx * Math.sin(AZ) + nz * Math.cos(AZ)) * .5 + .5, 0, 1);
      const a0 = rg(h.r, 0, i), a1 = rg(h.r, 0, i + 1), m0 = rg(h.r * .52, h.h * .56, i), m1 = rg(h.r * .52, h.h * .56, i + 1);
      if (a0.z < 10 || a1.z < 10 || m0.z < 10 || m1.z < 10) continue;
      ctx.fillStyle = rgb([57, 111, 67], .68 + lit * .52, t);
      ctx.beginPath(); ctx.moveTo(a0.sx,a0.sy); ctx.lineTo(a1.sx,a1.sy); ctx.lineTo(m1.sx,m1.sy); ctx.lineTo(m0.sx,m0.sy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = rgb([142, 145, 103], .72 + lit * .48, t);
      ctx.beginPath(); ctx.moveTo(m0.sx,m0.sy); ctx.lineTo(m1.sx,m1.sy); ctx.lineTo(pk.sx,pk.sy); ctx.closePath(); ctx.fill();
    }
  }

  // Scattered reef heads outside the main shore add subtle shallow-water detail.
  if (c.z < 2400) for (const reef of o.reefs) {
    const rp = proj(wx + Math.cos(reef.a) * reef.d, 0, wz + Math.sin(reef.a) * reef.d);
    if (rp.z < 12) continue;
    const rr = cl(reef.s * F / rp.z, .45, 3.2);
    disc(rp.sx, rp.sy, rr * 1.8, rr * .62, 'rgba(107,190,169,.32)');
  }
}

function ridge(hy, n1, n2, col, amp, thr, off) {
  const extent = Math.max(300, CX + 48), step = Math.max(2.8, W / 230);
  ctx.beginPath(); ctx.moveTo(-extent, hy);
  for (let sx = -extent; sx <= extent; sx += step) {
    const a = camYaw + Math.atan(sx / F) + off;
    const n = Math.sin(a * n1 + 1.3) * .39 + Math.sin(a * n2 + .4) * .27 +
      Math.sin(a * n1 * 2.3 + 2.1) * .18 + Math.sin(a * 14.7 + 1.8) * .10 + Math.sin(a * 25.1) * .06;
    const h = Math.max(0, n - thr) * amp;
    ctx.lineTo(sx, hy - h);
  }
  ctx.lineTo(extent, hy); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}


function drawFlareEffects(list) {
  for (const flare of list) {
    const p = proj(flare.x, flare.y, flare.z), q = proj(flare.x - flare.vx * .065, flare.y - flare.vy * .065, flare.z - flare.vz * .065);
    if (p.z < 3 || q.z < 3) continue;
    const fade = cl(flare.life / flare.maxLife, 0, 1);
    ctx.strokeStyle = `rgba(255,154,55,${.72 * fade})`; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(q.sx, q.sy); ctx.stroke();
    const r = Math.max(1, 2.5 * F / p.z);
    disc(p.sx, p.sy, r, r, `rgba(255,238,195,${.9 * fade})`);
  }
}

// Aerodynamic slipstream around a missile body. Several thin helical streamlines
// wrap the airframe and carry moving highlights from nose to tail; their intensity
// scales with missile velocity, separate from the hot motor plume/tracer.
function drawMissileAirflow(m) {
  const v = Math.hypot(m.vx || 0, m.vy || 0, m.vz || 0);
  if (v < 135) return;
  const f = [(m.vx || 0) / v, (m.vy || 0) / v, (m.vz || 0) / v];
  let side = [f[2], 0, -f[0]];
  let sideLen = Math.hypot(side[0], side[2]);
  if (sideLen < .001) { side = [1, 0, 0]; sideLen = 1; }
  side = side.map(q => q / sideLen);
  const up = [f[1] * side[2] - f[2] * side[1], f[2] * side[0] - f[0] * side[2], f[0] * side[1] - f[1] * side[0]];
  const intensity = cl((v - 135) / 360, 0, 1);
  const phaseBase = tick * (.58 + intensity * .72) + (m.age || 0) * .42;
  const length = 4.6;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'screen';
  for (let strand = 0; strand < 4; strand++) {
    const angle0 = strand * Math.PI * .5;
    const pointAt = t => {
      const angle = angle0 + t * 1.55 + Math.sin(t * 7 + phaseBase) * .075;
      const radius = .15 + t * .065 + Math.sin(t * 5 + phaseBase + strand) * .018;
      const axial = 1.25 - t * length;
      return proj(
        m.x + f[0] * axial + side[0] * Math.cos(angle) * radius + up[0] * Math.sin(angle) * radius,
        m.y + f[1] * axial + side[1] * Math.cos(angle) * radius + up[1] * Math.sin(angle) * radius,
        m.z + f[2] * axial + side[2] * Math.cos(angle) * radius + up[2] * Math.sin(angle) * radius
      );
    };
    ctx.beginPath();
    let good = true, depth = 0;
    for (let j = 0; j <= 12; j++) {
      const q = pointAt(j / 12);
      if (q.z < 3) { good = false; break; }
      depth += q.z;
      if (j === 0) ctx.moveTo(q.sx, q.sy); else ctx.lineTo(q.sx, q.sy);
    }
    if (!good) continue;
    ctx.globalAlpha = .10 + intensity * .18;
    ctx.strokeStyle = 'rgba(205,229,239,.76)';
    ctx.lineWidth = cl(.075 * F / (depth / 13), .42, 1.05);
    ctx.stroke();

    const phase = ((phaseBase * .48 + strand * .23) % 1 + 1) % 1;
    const end = Math.min(.98, phase + .18);
    if (end > phase + .02) {
      ctx.beginPath();
      let visible = true, highlightDepth = 0;
      for (let j = 0; j <= 7; j++) {
        const q = pointAt(phase + (end - phase) * j / 7);
        if (q.z < 3) { visible = false; break; }
        highlightDepth += q.z;
        if (j === 0) ctx.moveTo(q.sx, q.sy); else ctx.lineTo(q.sx, q.sy);
      }
      if (visible) {
        ctx.globalAlpha = .14 + intensity * .34;
        ctx.strokeStyle = 'rgba(239,249,252,.9)';
        ctx.lineWidth = cl(.12 * F / (highlightDepth / 8), .48, 1.3);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function render() {
  const mt = missiles > 0 ? 'MSL ' + missiles : 'RLD ' + Math.max(0, Math.ceil(MISSILE_RACK_RELOAD_SECONDS - missileReloadT)) + 's';
  if (msl.textContent !== mt) msl.textContent = mt;
  msl.setAttribute('aria-label', missiles > 0 ? `${missiles} missiles remaining` : `Missile rack reloading, ${Math.ceil(MISSILE_RACK_RELOAD_SECONDS - missileReloadT)} seconds remaining`);
  const blackoutActive = consciousnessT > 0;
  blackoutOverlay.classList.toggle('active', blackoutActive);
  document.body.classList.toggle('blackout-active', blackoutActive);
  combatToast.textContent = msgS;
  combatToast.classList.toggle('active', msgT > 0 && !!msgS);
  const ft = flareCount > 0 ? 'FLR ' + flareCount : 'RLD ' + Math.max(0, Math.ceil(FLARE_RACK_RELOAD_SECONDS - flareRechargeT)) + 's';
  if (flareBtn.textContent !== ft) flareBtn.textContent = ft;
  flareBtn.setAttribute('aria-label', flareCount > 0 ? `${flareCount} flare salvos remaining` : `Flare rack reloading, ${Math.ceil(FLARE_RACK_RELOAD_SECONDS - flareRechargeT)} seconds remaining`);
  flareBtn.classList.toggle('empty', flareCount <= 0);
  msl.classList.toggle('rdy', !!(lockE && lockT >= LT && missiles > 0 && state === 'play'));
  gun.classList.toggle('hot', gunOverheated);
  const gunLabel = gunOverheated ? 'GUN<br>HOT' : 'GUN<br>20MM';
  if (gun.innerHTML !== gunLabel) gun.innerHTML = gunLabel;

  const shx = shake ? R(-1, 1) * shake * 2 : 0, shy = shake ? R(-1, 1) * shake * 2 : 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(CX + shx, CY + shy);
  ctx.rotate(-camRoll);

  const hy = Math.tan(camPitch) * F;
  // Deep zenith fading through atmospheric blue into warm horizon haze.
  let g = ctx.createLinearGradient(0, -H * 1.7, 0, hy + 8);
  g.addColorStop(0, '#102b51'); g.addColorStop(.36, '#1d4c78'); g.addColorStop(.68, '#4f87ad');
  g.addColorStop(.88, '#a6c6d5'); g.addColorStop(1, '#e1d9c1');
  ctx.fillStyle = g; ctx.fillRect(-900, -H * 2, 1800, hy + H * 2);
  const upperGlow = ctx.createLinearGradient(0, hy - 230, 0, hy + 10);
  upperGlow.addColorStop(0, 'rgba(110,166,205,0)'); upperGlow.addColorStop(.7, 'rgba(211,225,222,.16)'); upperGlow.addColorStop(1, 'rgba(249,225,183,.46)');
  ctx.fillStyle = upperGlow; ctx.fillRect(-900, hy - 230, 1800, 242);

  // Sun bloom: broad atmospheric glow, warm aureole and a restrained bright disc.
  const sn = proj(camX + Math.sin(AZ) * Math.cos(EL) * 9000, camY + Math.sin(EL) * 9000, camZ + Math.cos(AZ) * Math.cos(EL) * 9000);
  const sunOn = sn.z > 0 && Math.abs(sn.sx) < W * 1.2 && Math.abs(sn.sy) < H * 1.4;
  if (sunOn) {
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    g = ctx.createRadialGradient(sn.sx, sn.sy, 2, sn.sx, sn.sy, 190);
    g.addColorStop(0, 'rgba(255,250,226,.78)'); g.addColorStop(.12, 'rgba(255,233,185,.32)');
    g.addColorStop(.48, 'rgba(255,212,151,.10)'); g.addColorStop(1, 'rgba(255,220,170,0)');
    ctx.fillStyle = g; ctx.fillRect(sn.sx-190,sn.sy-190,380,380);
    g = ctx.createRadialGradient(sn.sx, sn.sy, 1, sn.sx, sn.sy, 35);
    g.addColorStop(0,'rgba(255,255,242,.95)'); g.addColorStop(.34,'rgba(255,241,207,.78)'); g.addColorStop(1,'rgba(255,222,177,0)');
    ctx.fillStyle = g; ctx.fillRect(sn.sx-38,sn.sy-38,76,76);
    ctx.restore();
    disc(sn.sx, sn.sy, 6.5, 6.5, '#fffdf1');
    // Soft internal lens ghosts are kept faint so they read as optics, not arcade pickups.
    if (Math.abs(sn.sx) < W * .9 && Math.abs(sn.sy) < H * .9) {
      const gx = CX + (CX - sn.sx) * .22, gy = CY + (CY - sn.sy) * .22;
      disc(gx, gy, 15, 7, 'rgba(255,220,173,.055)');
      disc(CX + (CX-sn.sx)*.43, CY + (CY-sn.sy)*.43, 5, 5, 'rgba(190,224,244,.045)');
    }
  }

  // Fine, broken cirrus filaments rather than flat white dashes.
  ctx.save(); ctx.lineCap = 'round';
  for (const o of cirrus) {
    const p = proj(camX + Math.sin(o.a) * Math.cos(o.e) * 9000, camY + Math.sin(o.e) * 9000, camZ + Math.cos(o.a) * Math.cos(o.e) * 9000);
    if (p.z <= 0 || Math.abs(p.sx) > W * 1.25 || Math.abs(p.sy) > H * 1.25) continue;
    const w = cl(o.w * F / p.z, 3, 92), drift = Math.sin(tick * .018 + o.phase) * 2;
    ctx.globalAlpha = .08 + .08 * (1 - p.z / 18000);
    ctx.strokeStyle = 'rgba(246,250,251,.78)'; ctx.lineWidth = cl(w * .055,.45,1.7);
    for (let j=-2;j<=2;j++) {
      ctx.beginPath(); ctx.moveTo(p.sx-w*.55+j*2,p.sy+drift+j*1.4);
      ctx.quadraticCurveTo(p.sx,p.sy-w*.035+j*1.1,p.sx+w*.65,p.sy+drift*.4+j*1.7); ctx.stroke();
    }
  }
  ctx.restore(); ctx.globalAlpha = 1;

  // Layered distant landforms and atmospheric perspective at the horizon.
  ridge(hy, 2.05, 5.35, 'rgba(154,184,192,.92)', 35, .02, .35);
  ridge(hy + 1, 3.7, 9.1, 'rgba(99,145,158,.92)', 23, .18, 1.7);
  ridge(hy + 2, 5.4, 12.6, 'rgba(53,104,126,.82)', 13, .32, 2.8);
  g = ctx.createLinearGradient(0, hy - 52, 0, hy + 10);
  g.addColorStop(0, 'rgba(238,225,194,0)'); g.addColorStop(.6, 'rgba(238,225,194,.24)'); g.addColorStop(1, 'rgba(248,230,194,.62)');
  ctx.fillStyle = g; ctx.fillRect(-900, hy - 52, 1800, 64);

  // Open water fades from pale tropical blue near the horizon to deep navy below.
  g = ctx.createLinearGradient(0, hy, 0, H * 1.95);
  g.addColorStop(0, '#a4c7cb'); g.addColorStop(.10, '#5b9eae'); g.addColorStop(.28, '#28799a');
  g.addColorStop(.62, '#155477'); g.addColorStop(1, '#071d35');
  ctx.fillStyle = g; ctx.fillRect(-900, hy, 1800, H * 2.4);
  // A low-contrast aerial haze veil softens the far sea and visually separates
  // distant land, cloud banks, and the near-water layer.
  const seaHaze = ctx.createLinearGradient(0, hy - 2, 0, hy + H * .48);
  seaHaze.addColorStop(0, 'rgba(225,238,229,.18)');
  seaHaze.addColorStop(.22, 'rgba(172,211,211,.07)');
  seaHaze.addColorStop(1, 'rgba(90,153,177,0)');
  ctx.fillStyle = seaHaze; ctx.fillRect(-900, hy, 1800, H * .52);

  // Perspective wave bands: spacing, height and curvature compress toward the horizon.
  const off = (dist * .72) % 138;
  for (let k = 1; k < 52; k++) {
    const zd = k * 138 - off; if (zd < 24) continue;
    const y = hy + F * Math.max(camY, 5) / zd; if (y > H + 80) break;
    const scale = F / zd, amp = cl(scale * 2.4, .35, 2.6);
    ctx.beginPath();
    for (let j=0;j<=10;j++) {
      const x = -W * 1.15 + j * (W * 2.3 / 10);
      const phase = j * .74 + k * 1.37 + dist * .003;
      const yy = y + Math.sin(phase) * amp + Math.sin(phase * .47) * amp * .48;
      j ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
    }
    ctx.strokeStyle = k % 3 === 0 ? 'rgba(211,235,231,.19)' : 'rgba(8,43,64,.11)';
    ctx.lineWidth = cl(scale * 4.2,.45,2.8); ctx.stroke();
    if (k % 4 === 0) {
      ctx.strokeStyle = 'rgba(221,238,227,.13)'; ctx.lineWidth = cl(scale * 1.5,.4,1.2);
      ctx.beginPath(); ctx.moveTo(-W, y+amp*1.8); ctx.lineTo(W, y+amp*1.8); ctx.stroke();
    }
  }

  // Sun glitter is broken into small moving facets, never a single flat stripe.
  if (sunOn && sn.sy < hy + 4) {
    ctx.save(); ctx.lineCap = 'round';
    for (let i=0;i<38;i++) {
      const u = i / 38, yy = hy + 8 + u * Math.max(30, H * 1.15);
      const spread = 3 + u * 38, phase = i * 1.91 + tick * .7;
      const x = sn.sx + Math.sin(phase) * spread * .48;
      const len = (4 + 18 * u) * (.45 + .55 * Math.sin(phase * 1.7) ** 2);
      ctx.strokeStyle = `rgba(255,235,190,${.20 * (1-u)})`; ctx.lineWidth = cl(1.6-u,.35,1.5);
      ctx.beginPath(); ctx.moveTo(x-len,yy); ctx.lineTo(x+len,yy+Math.sin(phase)*.7); ctx.stroke();
    }
    ctx.restore();
  }

  // Fine water glints fill the spaces between projected wave bands.
  // Their positions are precomputed; only a tiny phase shift is evaluated per frame.
  ctx.save(); ctx.lineCap = 'round';
  for (const q of seaGlints) {
    const yy = hy + 8 + q.depth * Math.max(24,H-hy+18);
    const xx = q.x * W * .52 + Math.sin(tick*.24+q.phase) * (2+q.depth*5);
    const len = q.length * (.42 + q.depth * 1.15) * (0.72 + .28*Math.sin(tick*.5+q.phase));
    const alpha = (.045 + q.depth*.095) * q.tone;
    ctx.strokeStyle = `rgba(218,239,230,${alpha})`; ctx.lineWidth = .45 + q.depth*.55;
    ctx.beginPath(); ctx.moveTo(xx-len,yy); ctx.lineTo(xx+len,yy+Math.sin(q.phase+tick*.35)*.55); ctx.stroke();
  }
  ctx.restore();

  // World-anchored whitecaps and short crossing wavelets, culled by depth.
  ctx.save(); ctx.lineCap = 'round';
  for (const q of caps) {
    const p = proj(camX + wrap(q.x - camX), 0, camZ + wrap(q.z - camZ));
    if (p.z < 36 || p.z > 2700 || Math.abs(p.sx) > W * .62 || p.sy < hy) continue;
    const sc = F / p.z, len = cl(q.length * sc, .55, 13), alpha = cl((1.15 - p.z / 2700) * .30 * q.tone, .025, .24);
    const wobble = Math.sin(q.phase + tick * .42) * cl(sc * 1.6,.15,1.3);
    ctx.strokeStyle = `rgba(224,244,238,${alpha})`; ctx.lineWidth = cl(sc * 2.4,.45,1.65);
    ctx.beginPath(); ctx.moveTo(p.sx-len*.55,p.sy); ctx.quadraticCurveTo(p.sx,p.sy+wobble,p.sx+len*.55,p.sy+wobble*.25); ctx.stroke();
    if (len > 3.5) {
      ctx.strokeStyle = `rgba(255,255,255,${alpha*.52})`; ctx.lineWidth = .45;
      ctx.beginPath(); ctx.moveTo(p.sx-len*.22,p.sy-.7); ctx.lineTo(p.sx+len*.18,p.sy-.7); ctx.stroke();
    }
  }
  ctx.restore();

  // Very faint, elongated cloud shadows ground the cloud layer without forming
  // the oversized dark discs that made the previous scene look synthetic.
  for (const o of clouds) {
    const p = proj(camX + wrap(o.x - camX) - Math.sin(AZ) * o.y * 1.25, 0, camZ + wrap(o.z - camZ) - Math.cos(AZ) * o.y * 1.25);
    if (p.z < 140 || p.z > 2600) continue;
    const rx = o.w * .42 * F / p.z; if (rx < 3) continue;
    ctx.globalAlpha = .45;
    disc(p.sx, p.sy, rx * 1.15, rx * .105, 'rgba(18,48,67,.15)');
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,239,211,.15)'; ctx.fillRect(-900, Math.floor(hy), 1800, 1.5);

  for (const o of isl) drawIsland(o);

  // Layered atmospheric cloud banks: irregular cached silhouettes, varied
  // vertical scales and restrained alpha create distance without repeating blobs.
  for (const o of clouds) {
    const driftX = Math.sin(tick * .006 + o.windPhase) * 9;
    const driftZ = Math.cos(tick * .004 + o.windPhase) * 5;
    const p = proj(camX + wrap(o.x + driftX - camX), o.y, camZ + wrap(o.z + driftZ - camZ));
    if (p.z < 145 || p.z > 3500 || Math.abs(p.sx) > W * .84) continue;
    // Keep close cloud billboards large enough to feel immersive but cap their
    // projected footprint so one near cloud cannot swallow half the viewport.
    const w = Math.min(o.w * F / p.z, W * .17); if (w < 2.1) continue;
    const fade = cl((4050 - p.z) / 1450, .08, 1) * o.opacity;
    const sw = w * 1.96, sh = Math.min(w * (.94 * (o.heightScale || 1)), H * .34);
    const sprite = cloudSprites[o.variant % cloudSprites.length];
    ctx.save(); ctx.translate(p.sx,p.sy); ctx.rotate(o.rot || 0);
    if ((o.variant === 1 || o.variant === 3 || o.variant === 6) && o.cluster !== 0) {
      const satelliteA = cloudSprites[(o.variant + 2) % cloudSprites.length];
      const satelliteB = cloudSprites[(o.variant + 5) % cloudSprites.length];
      ctx.globalAlpha = fade * .36;
      ctx.drawImage(satelliteA, -sw * .72, -sh * .18, sw * .76, sh * .78);
      if (o.cluster === 3) ctx.drawImage(satelliteB, sw * .10, -sh * .13, sw * .68, sh * .72);
    }
    ctx.globalAlpha = fade;
    ctx.drawImage(sprite, -sw * .5, -sh * .5, sw, sh);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // Enemy Bandits sorted far-to-near
  const es = en.slice().concat(wingmen.filter(w => !w.dead)).sort((a, b) => ((b.x - camX) ** 2 + (b.y - camY) ** 2 + (b.z - camZ) ** 2) - ((a.x - camX) ** 2 + (a.y - camY) ** 2 + (a.z - camZ) ** 2));
  for (const e of es) drawEnemyJet(e);

  // Player missiles, hostile missiles and hot flare decoys.
  for (const m of ms) {
    const p = proj(m.x, m.y, m.z), q = proj(m.x - m.vx * .05, m.y - m.vy * .05, m.z - m.vz * .05);
    if (p.z < 3 || q.z < 3) continue;
    ctx.strokeStyle = 'rgba(255,170,60,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(q.sx, q.sy); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(q.sx, q.sy); ctx.stroke();
    drawMissileAirflow(m);
  }
  for (const m of incomingMissiles) {
    const p = proj(m.x, m.y, m.z), q = proj(m.x - m.vx * .045, m.y - m.vy * .045, m.z - m.vz * .045);
    if (p.z < 3 || q.z < 3) continue;
    ctx.strokeStyle = 'rgba(255,72,48,.72)'; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(q.sx, q.sy); ctx.stroke();
    ctx.strokeStyle = '#fff0dc'; ctx.lineWidth = 1.15;
    ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(q.sx, q.sy); ctx.stroke();
    drawMissileAirflow(m);
  }
  drawFlareEffects(flares);
  drawFlareEffects(wingmanFlares);
  drawFlareEffects(enemyFlares);

  // Cannon Tracer Streams
  ctx.save(); ctx.lineCap = 'round'; ctx.globalCompositeOperation = 'lighter';
  for (const b of bl) {
    const p = proj(b.x, b.y, b.z), q = proj(b.x - b.vx * .04, b.y - b.vy * .04, b.z - b.vz * .04);
    if (p.z < 3 || q.z < 3) continue;
    const hostile = !!b.e;
    ctx.strokeStyle = hostile ? 'rgba(255,104,72,.34)' : 'rgba(255,213,132,.38)'; ctx.lineWidth = hostile ? 2.8 : 2.6;
    ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(q.sx, q.sy); ctx.stroke();
    ctx.strokeStyle = hostile ? '#ffe5d7' : '#fff8e6'; ctx.lineWidth = .9;
    ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(q.sx, q.sy); ctx.stroke();
  }
  ctx.restore();

  // Layered hot cores and soft smoke puffs add depth without per-particle gradients.
  for (const o of pt) {
    const p = proj(o.x, o.y, o.z); if (p.z < 3 || p.z > 4200) continue;
    const s = Math.max(.8, 5.8 * F / p.z * Math.min(1, o.l) * (o.k ? 2.0 : 1));
    if (o.k) {
      ctx.globalAlpha = cl(o.l * .42,.04,.42);
      disc(p.sx,p.sy,s*.68,s*.40,'rgba(74,83,91,.45)');
      ctx.globalAlpha = cl(o.l * .5,.04,.5);
      disc(p.sx,p.sy,s*.48,s*.30,o.c);
    } else {
      ctx.globalAlpha = .22;
      disc(p.sx,p.sy,s*.95,s*.95,'rgba(255,122,45,.48)');
      ctx.globalAlpha = cl(.4 + o.l*.65,.35,1);
      disc(p.sx,p.sy,s*.42,s*.42,o.c);
    }
  }
  ctx.globalAlpha = 1;

  // Draw the aircraft first, then its wakes: the filaments should trail visibly
  // behind the wingtips rather than disappear underneath the airframe polygons.
  if (viewMode === 'outside') {
    drawPlayerJetOutside();
    drawWingVortexTrails();
  }

  ctx.restore();
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

  if (state === 'play') targets();
  if (viewMode === 'cockpit') cockpit();
  else outsideTacticalHUD();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,0,0,' + Math.min(.40, flash * .28) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (impactFeedbackT > 0) {
    const edgeAlpha = Math.min(.8, impactFeedbackT * .55);
    ctx.strokeStyle = `rgba(255,45,38,${edgeAlpha})`;
    ctx.lineWidth = 5;
    ctx.strokeRect(2.5, 2.5, W - 5, H - 5);
  }
  hudTextOverlay();
  drawTunnelVision();
}

// ============================================================================
// 9. TACTICAL HUD FOR OUTSIDE VIEW & COCKPIT INSTRUMENTATION
// ============================================================================
function outsideTacticalHUD() {
  const G = '#7effa4';
  const c = Math.cos(pitch), f = [Math.sin(yaw) * c, Math.sin(pitch), Math.cos(yaw) * c];
  // Project gun/aiming boresight point 400m ahead of player's nose
  const aim = proj(P.x + f[0] * 400, P.y + f[1] * 400, P.z + f[2] * 400);
  if (aim.z > 10) {
    const cr = Math.cos(camRoll), sr = Math.sin(camRoll);
    const ax = CX + (aim.sx * cr + aim.sy * sr);
    const ay = CY + (-aim.sx * sr + aim.sy * cr);
    ctx.strokeStyle = 'rgba(126, 255, 164, 0.85)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(ax, ay, 8, 0, 7); ctx.stroke();
    ctx.fillStyle = G;
    ctx.fillRect(ax - 1, ay - 1, 2, 2);
    ctx.fillRect(ax - 13, ay - 0.5, 4, 1);
    ctx.fillRect(ax + 9, ay - 0.5, 4, 1);
    ctx.fillRect(ax - 0.5, ay - 13, 1, 4);
  }

  // Bottom-Left Mini Radar Scope & Bottom-Center Hull/Missile Bar
  const rx = 43, ry = H - 43;
  ctx.fillStyle = 'rgba(4, 18, 12, 0.78)';
  ctx.beginPath(); ctx.arc(rx, ry, 31, 0, 7); ctx.fill();
  ctx.strokeStyle = '#32b866'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(rx, ry, 31, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(50, 184, 102, 0.35)';
  ctx.beginPath(); ctx.arc(rx, ry, 15.5, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx - 31, ry); ctx.lineTo(rx + 31, ry); ctx.moveTo(rx, ry - 31); ctx.lineTo(rx, ry + 31); ctx.stroke();

  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  for (const e of en) {
    const dx = e.x - P.x, dz = e.z - P.z, a = dx * cy - dz * sy, b = dx * sy + dz * cy;
    const l = Math.hypot(a, b) || 1, m = Math.min(1, l / 1800) * 27;
    const bx = rx + a / l * m, by = ry - b / l * m, lk = e === lockE;
    ctx.fillStyle = lk ? '#ffe04a' : '#ff4a3a';
    ctx.fillRect(bx - 2, by - 2, 4, 4);
  }
  for (const w of wingmen) {
    if (w.dead) continue;
    const dx = w.x - P.x, dz = w.z - P.z, a = dx * cy - dz * sy, b = dx * sy + dz * cy;
    const l = Math.hypot(a, b) || 1, m = Math.min(1, l / 1800) * 27;
    ctx.fillStyle = '#70e79a'; ctx.fillRect(rx + a / l * m - 2, ry - b / l * m - 2, 4, 4);
  }
  ctx.fillStyle = G; ctx.fillRect(rx - 1, ry - 1, 2, 2);
  if (teamMode2v2) {
    const friend = wingmen.find(w => !w.dead);
    ctx.font = 'bold 7px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = friend ? (friend.hp > 45 ? '#8bf0ad' : '#f0c16d') : '#ff6a5e';
    ctx.fillText(friend ? `WING ${Math.max(0, Math.round(friend.hp))}%  M${friend.missiles}  F${friend.flareCount}` : 'WING LOST', 8, H - 81);
  }

  // Compact Status Bar at bottom center
  const bx = CX - 56, by = H - 22;
  ctx.fillStyle = 'rgba(6, 12, 22, 0.78)';
  ctx.fillRect(bx, by, 112, 16);
  ctx.strokeStyle = 'rgba(122, 215, 255, 0.5)';
  ctx.strokeRect(bx + 0.5, by + 0.5, 111, 15);
  ctx.fillStyle = hp > 40 ? '#5ae06a' : '#ff4a3a';
  ctx.fillRect(bx + 4, by + 4, 62 * cl(hp / 100, 0, 1), 8);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 7px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`HULL ${Math.max(0, Math.round(hp))}%`, bx + 7, by + 10.5);
  ctx.fillStyle = '#8ad8ff'; ctx.textAlign = 'right';
  ctx.fillText(`ALT ${Math.round(P.y)}m`, bx + 108, by + 10.5);

  const gy = H - 40;
  ctx.fillStyle = 'rgba(6,12,22,.78)'; ctx.fillRect(bx, gy, 112, 10);
  ctx.strokeStyle = gunOverheated ? 'rgba(255,80,65,.9)' : 'rgba(220,235,245,.45)';
  ctx.strokeRect(bx + .5, gy + .5, 111, 9);
  ctx.fillStyle = gunOverheated ? '#ff4a3a' : (gunHeat > 72 ? '#e9b65d' : '#d7e2ed');
  ctx.fillRect(bx + 3, gy + 3, 106 * (gunHeat / 100), 4);
  ctx.fillStyle = '#fff'; ctx.font = '6px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(gunOverheated ? 'GUN HOT' : 'GUN', bx + 4, gy + 7);
  ctx.textAlign = 'left';
}

function targets() {
  const c = Math.cos(camRoll), s = Math.sin(camRoll); let best = null, bd = 1e9;
  const sc = p => {
    let a, b;
    if (p.z > 1) { a = p.sx; b = p.sy; } else { a = p.a * 1e3; b = p.b * 1e3; }
    return { x: a * c + b * s, y: -a * s + b * c, on: p.z > 1 };
  };
  ctx.lineWidth = 1.3; ctx.textAlign = 'center'; ctx.font = '8px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif';
  for (const e of en) {
    const d = Math.hypot(e.x - P.x, e.y - P.y, e.z - P.z);
    if (d < bd) { bd = d; best = e; }
    const p = proj(e.x, e.y, e.z), q = sc(p);
    if (!q.on || Math.abs(q.x) > CX - 10 || Math.abs(q.y) > CY - 26) continue;
    const x = CX + q.x, y = CY + q.y, k = Math.max(6, Math.min(16, 46 * F / p.z / 2));
    if (e === lockE) {
      const lk = lockT >= LT, kk = k + (1 - lockT / LT) * 14;
      ctx.strokeStyle = lk ? '#ff3a2a' : '#ffe04a';
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
        ctx.beginPath();
        ctx.moveTo(x + sx * kk, y + sy * (kk - 5));
        ctx.lineTo(x + sx * kk, y + sy * kk);
        ctx.lineTo(x + sx * (kk - 5), y + sy * kk);
        ctx.stroke();
      });
      if (lk) {
        ctx.beginPath();
        ctx.moveTo(x, y - kk - 4); ctx.lineTo(x + kk + 4, y);
        ctx.lineTo(x, y + kk + 4); ctx.lineTo(x - kk - 4, y);
        ctx.closePath(); ctx.stroke();
      }
      if (lk) {
        ctx.fillStyle = ctx.strokeStyle;
        ctx.fillText('LOCK', x, y + kk + 13);
        ctx.fillText(Math.round(d) + 'm', x, y - kk - 6);
      }
    } else {
      ctx.strokeStyle = 'rgba(255,90,70,.55)';
      ctx.strokeRect(x - k, y - k, 2 * k, 2 * k);
    }
  }
  // Friendly wingman identification: a blue square mirrors the hostile brackets,
  // but stays visually distinct from the red enemy boxes and yellow missile lock.
  for (const w of wingmen) {
    if (w.dead) continue;
    const p = proj(w.x, w.y, w.z), q = sc(p);
    if (!q.on || Math.abs(q.x) > CX - 10 || Math.abs(q.y) > CY - 26) continue;
    const x = CX + q.x, y = CY + q.y;
    const k = Math.max(6, Math.min(16, 46 * F / p.z / 2));
    ctx.strokeStyle = 'rgba(72,174,255,.92)';
    ctx.lineWidth = 1.35;
    ctx.strokeRect(x - k, y - k, 2 * k, 2 * k);
    // Small corner ticks make the friendly marker readable against bright clouds.
    ctx.strokeStyle = 'rgba(154,218,255,.82)';
    ctx.lineWidth = .8;
    const t = Math.max(2.5, k * .28);
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + sx * k, y + sy * (k - t));
      ctx.lineTo(x + sx * k, y + sy * k);
      ctx.lineTo(x + sx * (k - t), y + sy * k);
      ctx.stroke();
    }
  }

  if (best) {
    const p = proj(best.x, best.y, best.z), q = sc(p);
    if (!(q.on && Math.abs(q.x) < CX - 10 && Math.abs(q.y) < CY - 26)) {
      const ang = Math.atan2(q.y, q.x), ex = CX + Math.cos(ang) * (CX - 16), ey = CY + Math.sin(ang) * (CY - 34);
      ctx.fillStyle = '#ff4a3a'; ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.fill(); ctx.restore();
    }
  }
  ctx.textAlign = 'left';
}

function drawTunnelVision() {
  const blackoutRatio = consciousnessT > 0 ? cl(consciousnessT / Math.max(.01, consciousnessDuration), 0, 1) : 0;
  const amount = cl(Math.max(tunnelVision, consciousnessT > 0 ? .97 : 0), 0, .97);
  if (amount > .015) {
    const band = W * (.06 + amount * .34);
    ctx.save();
    let g = ctx.createLinearGradient(0, 0, band, 0);
    g.addColorStop(0, `rgba(0,0,0,${.88 * amount})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, band, H);
    g = ctx.createLinearGradient(W, 0, W - band, 0);
    g.addColorStop(0, `rgba(0,0,0,${.88 * amount})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(W - band, 0, band, H);
    const verticalBand = H * (.03 + amount * .12);
    g = ctx.createLinearGradient(0, 0, 0, verticalBand);
    g.addColorStop(0, `rgba(0,0,0,${.5 * amount})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, verticalBand);
    g = ctx.createLinearGradient(0, H, 0, H - verticalBand);
    g.addColorStop(0, `rgba(0,0,0,${.5 * amount})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, H - verticalBand, W, verticalBand);
    ctx.restore();
  }
  // Fade the whole scene, not a percentage gauge: exposure darkens gradually,
  // unconsciousness briefly blacks out the view, then vision returns with recovery.
  const exposure = cl(highGTime / GLOC_EXPOSURE_LIMIT, 0, 1);
  const exposureDark = .76 * Math.pow(exposure, 1.25);
  const blackoutDark = .96 * Math.pow(blackoutRatio, 1.45);
  const globalDark = Math.max(exposureDark, blackoutDark);
  if (globalDark > .005) {
    ctx.fillStyle = `rgba(0,0,0,${globalDark})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function hudTextOverlay() {
  // Minimal score and three-segment range warning; no combat text banners.
  ctx.font = 'bold 7px "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#dce6ef'; ctx.fillText(String(score), W - 7, 12);
  if (state === 'play' && SFX.warningLevel > 0) {
    const level = SFX.warningLevel;
    const x = CX - 15, y = 8;
    ctx.fillStyle = 'rgba(0,0,0,.58)'; ctx.fillRect(x - 4, y - 3, 38, 11);
    const colors = ['#e5d16a', '#ed9c4b', '#ff493f'];
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < level ? colors[i] : '#3b424b';
      ctx.fillRect(x + i * 10, y, 7, 5);
    }
  }
  ctx.textAlign = 'left';
}

function cockpit() {
  // F-16 style cockpit: wide, clear bubble canopy; tall HUD glass with side posts; glareshield,
  // left MFD + RWR, centre ICP/DED + ADI, right analog engine cluster, grey side consoles.
  const S = cl(H / 650, .72, 1.18), TAU = Math.PI * 2;
  const heading = ((yaw * 180 / Math.PI) % 360 + 360) % 360;
  const lockReady = !!(lockE && lockT >= LT);
  const font = (n, bold = false) => `${bold ? 'bold ' : ''}${Math.max(5, n * S)}px Bahnschrift, "Arial Narrow", sans-serif`;
  const grad = (x0, y0, x1, y1, colors) => {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    colors.forEach((c, i) => g.addColorStop(i / (colors.length - 1), c));
    return g;
  };
  const poly = (pts, fill, stroke = null, w = 1) => {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = w; ctx.stroke(); }
  };
  const rr = (x, y, w, h, r) => {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  };
  const rivet = (x, y) => {
    ctx.fillStyle = '#0b0d0f'; ctx.beginPath(); ctx.arc(x, y + .6, 1 * S, 0, TAU); ctx.fill();
    ctx.fillStyle = '#6d757b'; ctx.beginPath(); ctx.arc(x, y, .8 * S, 0, TAU); ctx.fill();
  };
  const rivetLine = (x0, y0, x1, y1, n) => { for (let i = 0; i <= n; i++) rivet(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n); };
  const bezel = (x, y, w, h) => {
    rr(x - 4 * S, y - 4 * S, w + 8 * S, h + 8 * S, 3 * S);
    ctx.fillStyle = '#0a0c0e'; ctx.fill(); ctx.strokeStyle = '#6b7379'; ctx.lineWidth = 1 * S; ctx.stroke();
  };
  const key = (x, y, w, h, col) => {
    ctx.fillStyle = '#050607'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col; ctx.fillRect(x + w * .15, y + h * .15, w * .7, h * .7);
  };
  const knob = (x, y, r) => {
    ctx.fillStyle = '#050607'; ctx.beginPath(); ctx.arc(x, y, r * 1.2, 0, TAU); ctx.fill();
    ctx.fillStyle = grad(x - r, y - r, x + r, y + r, ['#8a9299', '#2a2f33']); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e8ebe8'; ctx.lineWidth = .9 * S; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + r * .6, y - r * .6); ctx.stroke();
  };
  const dial = (x, y, r, v, label, ticks = 10) => {
    ctx.fillStyle = '#0a0c0e'; ctx.beginPath(); ctx.arc(x, y, r * 1.16, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#80888e'; ctx.lineWidth = 1 * S; ctx.stroke();
    ctx.fillStyle = '#040506'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    const a0 = Math.PI * .75, a1 = Math.PI * 2.25;
    for (let i = 0; i <= ticks; i++) {
      const a = a0 + (a1 - a0) * i / ticks, c = Math.cos(a), s = Math.sin(a);
      ctx.strokeStyle = '#dcdfda'; ctx.lineWidth = (i % 2 ? .5 : .9) * S;
      ctx.beginPath(); ctx.moveTo(x + c * r * .78, y + s * r * .78); ctx.lineTo(x + c * r * .95, y + s * r * .95); ctx.stroke();
    }
    ctx.fillStyle = '#c7ccc8'; ctx.font = font(4.4); ctx.textAlign = 'center'; ctx.fillText(label, x, y + r * .5);
    const a = a0 + (a1 - a0) * cl(v, 0, 1);
    ctx.strokeStyle = '#f4f4ee'; ctx.lineWidth = 1.2 * S;
    ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * r * .15, y - Math.sin(a) * r * .15); ctx.lineTo(x + Math.cos(a) * r * .82, y + Math.sin(a) * r * .82); ctx.stroke();
    ctx.fillStyle = '#20252a'; ctx.beginPath(); ctx.arc(x, y, r * .1, 0, TAU); ctx.fill();
  };

  ctx.save();
  // ---- glass: faint sky reflections only (no canopy bars, wide open view like the reference)
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = grad(0, 0, 0, H * .6, ['rgba(200,225,240,.05)', 'rgba(200,225,240,0)']); ctx.fillRect(0, 0, W, H * .6);
  ctx.restore();

  // ---- side tubs (grey, riveted) with canopy sill rails in the lower corners
  for (const left of [true, false]) {
    const X = x => left ? x * W : W - x * W;
    poly([[X(0), H * .78], [X(.12), H * .735], [X(.24), H * .695], [X(.24), H], [X(0), H]],
      grad(X(0), H * .7, X(.24), H, ['#4a4f54', '#2c3034', '#16181b']), '#0b0d0f', 1.5 * S);
    // raised wall lip
    poly([[X(0), H * .78], [X(.12), H * .735], [X(.24), H * .695], [X(.24), H * .715], [X(.12), H * .757], [X(0), H * .805]],
      grad(X(0), H * .7, X(0), H * .8, ['#6a7077', '#3a3f44']), '#101214', .8 * S);
    rivetLine(X(.015), H * .81, X(.225), H * .73, 9);
    // panel seams + switches
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1 * S;
    ctx.beginPath(); ctx.moveTo(X(.03), H * .86); ctx.lineTo(X(.23), H * .78); ctx.moveTo(X(.05), H * .93); ctx.lineTo(X(.23), H * .86); ctx.stroke();
    for (let i = 0; i < 6; i++) key(X(.045 + i * .028) - (left ? 0 : 4 * S), H * (.865 - i * .011), 4 * S, 7 * S, ['#b29b62', '#7d97a8', '#6f9c82'][i % 3]);
    // sill rail
    poly([[X(0), H * .93], [X(.2), H * .84], [X(.22), H * .865], [X(.05), H], [X(0), H]],
      grad(X(0), H * .85, X(.2), H, ['#9aa1a6', '#5a6066', '#2a2e32']), '#0d0f11', 1 * S);
  }

  // ---- main instrument body
  const bodyTop = H * .575;
  ctx.beginPath(); ctx.moveTo(W * .24, H * .70); ctx.lineTo(W * .248, H * .61);
  ctx.quadraticCurveTo(W * .252, bodyTop, W * .28, bodyTop); ctx.lineTo(W * .72, bodyTop);
  ctx.quadraticCurveTo(W * .748, bodyTop, W * .752, H * .61); ctx.lineTo(W * .76, H * .70);
  ctx.lineTo(W * .76, H); ctx.lineTo(W * .24, H); ctx.closePath();
  ctx.fillStyle = grad(0, bodyTop, 0, H, ['#33383d', '#1e2226', '#101214']); ctx.fill();
  ctx.strokeStyle = '#0a0c0e'; ctx.lineWidth = 2 * S; ctx.stroke();
  // glareshield top face
  ctx.beginPath(); ctx.moveTo(W * .248, H * .625); ctx.lineTo(W * .252, H * .61);
  ctx.quadraticCurveTo(W * .256, bodyTop, W * .28, bodyTop); ctx.lineTo(W * .72, bodyTop);
  ctx.quadraticCurveTo(W * .744, bodyTop, W * .748, H * .61); ctx.lineTo(W * .752, H * .625);
  ctx.quadraticCurveTo(CX, H * .612, W * .248, H * .625); ctx.closePath();
  ctx.fillStyle = grad(0, bodyTop, 0, H * .625, ['#5b6168', '#2b3035']); ctx.fill();
  ctx.strokeStyle = 'rgba(190,200,208,.30)'; ctx.lineWidth = 1 * S;
  ctx.beginPath(); ctx.moveTo(W * .28, bodyTop + 1); ctx.lineTo(W * .72, bodyTop + 1); ctx.stroke();
  rivetLine(W * .27, H * .606, W * .73, H * .606, 18);
  // vertical panel splits (left | centre | right)
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.4 * S;
  for (const fx of [.432, .568]) { ctx.beginPath(); ctx.moveTo(W * fx, H * .625); ctx.lineTo(W * fx, H); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(170,180,188,.16)'; ctx.lineWidth = .6;
  for (const fx of [.434, .570]) { ctx.beginPath(); ctx.moveTo(W * fx, H * .625); ctx.lineTo(W * fx, H); ctx.stroke(); }

  // ---- HUD: tall glass between two dark posts
  const gx0 = W * .442, gx1 = W * .558, gbx0 = W * .434, gbx1 = W * .566, gy0 = H * .33, gy1 = H * .585;
  poly([[W * .424, H * .60], [W * .424, H * .50], [W * .436, H * .485], [W * .436, H * .60]], '#17191c', '#4b5157', .8 * S);
  poly([[W * .576, H * .60], [W * .576, H * .50], [W * .564, H * .485], [W * .564, H * .60]], '#17191c', '#4b5157', .8 * S);
  poly([[gx0, gy0], [gx1, gy0], [gbx1, gy1], [gbx0, gy1]], 'rgba(120,175,160,.07)', 'rgba(185,220,212,.38)', 1 * S);
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = grad(gx0, gy0, gx1, gy1, ['rgba(190,235,220,.10)', 'rgba(190,235,220,0)', 'rgba(190,235,220,.05)']);
  poly([[gx0, gy0], [gx1, gy0], [gbx1, gy1], [gbx0, gy1]], ctx.fillStyle);
  ctx.restore();
  rr(gx0 - 2 * S, gy0 - 5 * S, gx1 - gx0 + 4 * S, 6 * S, 2 * S); ctx.fillStyle = '#101214'; ctx.fill(); // top housing
  rr(W * .428, gy1 - 3 * S, W * .144, 9 * S, 2 * S); ctx.fillStyle = '#0f1113'; ctx.fill(); // lower housing

  // HUD symbology (clipped to glass, real flight data)
  ctx.save();
  poly([[gx0, gy0], [gx1, gy0], [gbx1, gy1], [gbx0, gy1]], null); ctx.clip();
  const hg = '#7dffa8';
  ctx.strokeStyle = hg; ctx.fillStyle = hg; ctx.shadowColor = 'rgba(90,255,160,.8)'; ctx.shadowBlur = 4 * S; ctx.lineWidth = 1 * S;
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(-roll);
  for (let a = -20; a <= 20; a += 5) {
    const yy = F * (Math.tan(pitch) - Math.tan(a * Math.PI / 180)), hw = a === 0 ? 34 * S : 16 * S;
    if (Math.abs(yy) > H * .4) continue;
    ctx.beginPath();
    if (a === 0) { ctx.moveTo(-hw, yy); ctx.lineTo(-8 * S, yy); ctx.moveTo(8 * S, yy); ctx.lineTo(hw, yy); }
    else {
      const d = a > 0 ? 1 : -1;
      ctx.moveTo(-hw, yy + d * 3 * S); ctx.lineTo(-hw, yy); ctx.lineTo(-6 * S, yy);
      ctx.moveTo(6 * S, yy); ctx.lineTo(hw, yy); ctx.lineTo(hw, yy + d * 3 * S);
    }
    ctx.stroke();
    if (a) { ctx.font = font(6); ctx.textAlign = 'right'; ctx.fillText(Math.abs(a), -hw - 2 * S, yy + 2 * S); }
  }
  ctx.restore();
  // gun cross / pipper
  ctx.beginPath(); ctx.arc(CX, CY, 8 * S, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, 1.1 * S, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(CX - 17 * S, CY); ctx.lineTo(CX - 8 * S, CY); ctx.moveTo(CX + 8 * S, CY); ctx.lineTo(CX + 17 * S, CY);
  ctx.moveTo(CX, CY - 15 * S); ctx.lineTo(CX, CY - 8 * S); ctx.stroke();
  // speed (left), altitude (right), heading tape + readouts (bottom)
  ctx.font = font(8.5, true); ctx.textAlign = 'left';
  ctx.fillText(Math.round(speed * 1.94384), gbx0 + 4 * S, CY + 3 * S);
  ctx.textAlign = 'right'; ctx.fillText(Math.round(P.y * 3.28084), gbx1 - 4 * S, CY + 3 * S);
  ctx.strokeStyle = hg; ctx.lineWidth = .8 * S;
  ctx.strokeRect(gbx0 + 2 * S, CY - 6 * S, 28 * S, 12 * S); ctx.strokeRect(gbx1 - 30 * S, CY - 6 * S, 28 * S, 12 * S);
  const hty = gy1 - 20 * S, base = Math.round(heading / 10) * 10;
  ctx.beginPath(); ctx.moveTo(gbx0 + 8 * S, hty + 1); ctx.lineTo(gbx1 - 8 * S, hty + 1); ctx.stroke();
  for (let k = -3; k <= 3; k++) {
    const hx = CX + ((base + k * 10) - heading) * 2.1 * S, lab = ((base + k * 10) % 360 + 360) % 360;
    ctx.beginPath(); ctx.moveTo(hx, hty + 1); ctx.lineTo(hx, hty + 4 * S); ctx.stroke();
    ctx.font = font(5.6); ctx.textAlign = 'center'; ctx.fillText(String(lab / 10 | 0).padStart(2, '0'), hx, hty - 1.5 * S);
  }
  ctx.beginPath(); ctx.moveTo(CX, hty + 5 * S); ctx.lineTo(CX - 2.5 * S, hty + 9 * S); ctx.lineTo(CX + 2.5 * S, hty + 9 * S); ctx.closePath(); ctx.stroke();
  ctx.font = font(6.2, true); ctx.textAlign = 'left'; ctx.fillText('M ' + (speed / 340).toFixed(2), gbx0 + 4 * S, gy1 - 6 * S);
  ctx.textAlign = 'right'; ctx.fillText(lockReady ? ((tick * 4 | 0) % 2 ? 'SHOOT' : '') : 'AAM ' + missiles, gbx1 - 4 * S, gy1 - 6 * S);
  ctx.restore();

  // ---- left cluster: warning lights, RWR scope, left MFD
  for (let r = 0; r < 2; r++) for (let c = 0; c < 6; c++)
    key(W * .27 + c * 9 * S, H * .635 + r * 9 * S, 7 * S, 6 * S, (r * 6 + c) % 5 === 0 ? '#c9a24f' : '#262b2f');
  {
    const x = W * .395, y = H * .675, r = Math.min(W * .03, H * .055);
    ctx.fillStyle = '#0a0c0e'; ctx.beginPath(); ctx.arc(x, y, r * 1.18, 0, TAU); ctx.fill(); ctx.strokeStyle = '#7a8288'; ctx.lineWidth = 1 * S; ctx.stroke();
    ctx.fillStyle = '#031208'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(80,255,140,.7)'; ctx.lineWidth = .8 * S;
    for (const q of [.35, .68, 1]) { ctx.beginPath(); ctx.arc(x, y, r * q, 0, TAU); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
    ctx.fillStyle = 'rgba(80,255,140,.8)'; ctx.beginPath(); ctx.arc(x + Math.cos(tick * .8) * r * .6, y + Math.sin(tick * .8) * r * .6, 1.3 * S, 0, TAU); ctx.fill();
  }
  const md = { x: W * .29, y: H * .745, w: W * .125, h: H * .205 };
  bezel(md.x, md.y, md.w, md.h);
  ctx.fillStyle = grad(0, md.y, 0, md.y + md.h, ['#0c1f1b', '#041009']); ctx.fillRect(md.x, md.y, md.w, md.h);
  for (let i = 0; i < 5; i++) { // option buttons on the edges
    key(md.x + 6 * S + i * (md.w - 14 * S) / 4, md.y - 8 * S, 7 * S, 3.5 * S, '#9aa3a8');
    key(md.x + 6 * S + i * (md.w - 14 * S) / 4, md.y + md.h + 4.5 * S, 7 * S, 3.5 * S, '#9aa3a8');
  }
  {
    const cx = md.x + md.w / 2, cy = md.y + md.h * .62, r = Math.min(md.w * .42, md.h * .40), sw = (tick * .95) % TAU;
    ctx.save(); ctx.beginPath(); ctx.rect(md.x, md.y, md.w, md.h); ctx.clip();
    ctx.fillStyle = '#9fe8bf'; ctx.font = font(5.6, true); ctx.textAlign = 'left'; ctx.fillText('A-A  RWS', md.x + 4 * S, md.y + 8 * S);
    ctx.textAlign = 'right'; ctx.fillText('60', md.x + md.w - 4 * S, md.y + 8 * S);
    ctx.strokeStyle = 'rgba(90,220,150,.45)'; ctx.lineWidth = .6;
    for (const q of [.33, .66, 1]) { ctx.beginPath(); ctx.arc(cx, cy, r * q, Math.PI, 0); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - r); ctx.stroke();
    ctx.fillStyle = 'rgba(80,230,150,.14)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, -Math.PI / 2 + Math.sin(tick) * .9 - .3, -Math.PI / 2 + Math.sin(tick) * .9 + .3); ctx.closePath(); ctx.fill();
    const blip = (a, col) => {
      const dx = a.x - P.x, dz = a.z - P.z, xx = dx * Math.cos(yaw) - dz * Math.sin(yaw), zz = dx * Math.sin(yaw) + dz * Math.cos(yaw);
      const dist = Math.hypot(xx, zz) || 1, rd = Math.min(.95, dist / 2200) * r;
      ctx.fillStyle = col; ctx.fillRect(cx + xx / dist * rd - 1.5 * S, cy - Math.abs(zz) / dist * rd - 1.5 * S, 3 * S, 3 * S);
    };
    for (const e of en) blip(e, '#ff7f72');
    for (const w of wingmen) if (!w.dead) blip(w, '#6cc4ff');
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1 * S;
  ctx.beginPath(); ctx.moveTo(W * .255, H * .72); ctx.lineTo(W * .255, H); ctx.stroke();

  // ---- centre: ICP / DED, ADI, airspeed and altitude dials
  rr(W * .448, H * .625, W * .104, H * .085, 2 * S); ctx.fillStyle = '#0b0d0f'; ctx.fill(); ctx.strokeStyle = '#5f666c'; ctx.lineWidth = .9 * S; ctx.stroke();
  rr(W * .455, H * .632, W * .09, H * .028, 1.5 * S); ctx.fillStyle = '#03100a'; ctx.fill();
  ctx.fillStyle = '#86f0b0'; ctx.font = font(6, true); ctx.textAlign = 'left';
  ctx.fillText(`MSL ${missiles}  FLR ${flareCount}`, W * .458, H * .651);
  ctx.textAlign = 'right'; ctx.fillText(lockReady ? 'TRACK' : 'SRCH', W * .542, H * .651);
  for (let r = 0; r < 2; r++) for (let c = 0; c < 8; c++) key(W * .456 + c * W * .011, H * .667 + r * 8 * S, 7 * S, 6 * S, '#8e969b');
  knob(W * .456, H * .72, 5 * S); knob(W * .544, H * .72, 5 * S);
  {
    // Conventional attitude director indicator:
    // the horizon and pitch ladder move with pitch/bank while the miniature
    // aircraft remains fixed to the instrument case.
    const x = CX, y = H * .815, r = Math.min(W * .048, H * .088);
    ctx.fillStyle = '#090b0d';
    ctx.beginPath(); ctx.arc(x, y, r * 1.19, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#92999d'; ctx.lineWidth = 1.25 * S;
    ctx.beginPath(); ctx.arc(x, y, r * 1.13, 0, TAU); ctx.stroke();

    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
    ctx.translate(x, y);
    ctx.rotate(-roll);

    const pitchDeg = cl(pitch * 180 / Math.PI, -57.3, 57.3);
    const pitchScale = r / 45; // one radius represents 45 degrees
    const horizonY = cl(pitchDeg, -57.3, 57.3) * pitchScale;

    const sky = ctx.createLinearGradient(0, -r * 1.4, 0, horizonY);
    sky.addColorStop(0, '#3b82b5'); sky.addColorStop(1, '#24577d');
    ctx.fillStyle = sky;
    ctx.fillRect(-r * 1.5, -r * 2.5 + horizonY, r * 3, r * 2.5);

    const earth = ctx.createLinearGradient(0, horizonY, 0, r * 1.5);
    earth.addColorStop(0, '#9a7850'); earth.addColorStop(1, '#594531');
    ctx.fillStyle = earth;
    ctx.fillRect(-r * 1.5, horizonY, r * 3, r * 2.5);

    // Horizon boundary and subtle atmospheric separation.
    ctx.strokeStyle = '#f2e7ca'; ctx.lineWidth = 1.35 * S;
    ctx.beginPath(); ctx.moveTo(-r * 1.5, horizonY); ctx.lineTo(r * 1.5, horizonY); ctx.stroke();

    // Pitch ladder: positive pitch marks sit above the horizon; negative marks
    // below it. Long/short marks alternate and labels are signed correctly.
    ctx.font = font(5.4, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let deg = -30; deg <= 30; deg += 5) {
      if (deg === 0) continue;
      const yy = horizonY - deg * pitchScale;
      const major = Math.abs(deg) % 10 === 0;
      const half = (major ? .34 : .21) * r;
      ctx.strokeStyle = major ? 'rgba(255,255,245,.96)' : 'rgba(255,255,245,.72)';
      ctx.lineWidth = (major ? 1.0 : .65) * S;
      ctx.setLineDash(deg < 0 && major ? [2.2 * S, 1.8 * S] : []);
      ctx.beginPath();
      ctx.moveTo(-half, yy); ctx.lineTo(-.085 * r, yy);
      ctx.moveTo(.085 * r, yy); ctx.lineTo(half, yy);
      if (!major) {
        ctx.moveTo(-half, yy - 2 * S); ctx.lineTo(-half, yy + 2 * S);
        ctx.moveTo(half, yy - 2 * S); ctx.lineTo(half, yy + 2 * S);
      }
      ctx.stroke(); ctx.setLineDash([]);
      if (major) {
        ctx.fillStyle = '#fff8e8';
        ctx.fillText(String(Math.abs(deg)), -half - 7 * S, yy);
        ctx.fillText(String(Math.abs(deg)), half + 7 * S, yy);
      }
    }
    ctx.restore();

    // Fixed aircraft reference bars and center index.
    ctx.strokeStyle = '#ffd45b'; ctx.lineWidth = 2.0 * S; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x - r * .78, y);
    ctx.lineTo(x - r * .22, y);
    ctx.lineTo(x - r * .12, y + r * .13);
    ctx.lineTo(x + r * .12, y + r * .13);
    ctx.lineTo(x + r * .22, y);
    ctx.lineTo(x + r * .78, y);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y + r * .04, 1.7 * S, 0, TAU); ctx.stroke();

    // Bank-angle scale fixed to the case, with 10/20/30/45/60 degree ticks.
    ctx.save(); ctx.translate(x, y);
    for (const deg of [-60, -45, -30, -20, -10, 0, 10, 20, 30, 45, 60]) {
      const a = deg * Math.PI / 180 - Math.PI / 2;
      const major = Math.abs(deg) === 30 || Math.abs(deg) === 60 || deg === 0;
      const r0 = r * (major ? 1.02 : 1.055), r1 = r * (major ? .88 : .94);
      ctx.strokeStyle = '#f0f0e8'; ctx.lineWidth = (major ? 1.1 : .7) * S;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.stroke();
    }
    // Top bank index.
    ctx.fillStyle = '#ffd45b';
    ctx.beginPath(); ctx.moveTo(0, -r * .98); ctx.lineTo(-4 * S, -r * 1.10); ctx.lineTo(4 * S, -r * 1.10); ctx.closePath(); ctx.fill();
    ctx.restore();

    // Glass reflection and compact bezel screws.
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = 'rgba(225,244,250,.22)'; ctx.lineWidth = 2 * S;
    ctx.beginPath(); ctx.arc(x, y, r * .91, Math.PI * 1.12, Math.PI * 1.52); ctx.stroke();
    ctx.restore();
    for (const a of [Math.PI * .25, Math.PI * .75, Math.PI * 1.25, Math.PI * 1.75]) {
      ctx.fillStyle = '#a8afb2'; ctx.beginPath();
      ctx.arc(x + Math.cos(a) * r * 1.09, y + Math.sin(a) * r * 1.09, 1.05 * S, 0, TAU); ctx.fill();
    }
  }
  const ru = Math.min(W * .037, H * .07);
  dial(CX - W * .075, H * .945, ru, speed / 300, 'KT', 12);
  dial(CX + W * .075, H * .945, ru, cl(P.y / 3000, 0, 1), 'ALT', 10);

  // ---- right cluster: analog engine/systems gauges + digital readout
  const rg = Math.min(W * .027, H * .05);
  dial(W * .63, H * .675, rg, speed / 260, 'RPM', 10);
  dial(W * .705, H * .675, rg, cl(.35 + gunHeat / 160, 0, 1), 'FTIT', 10);
  rr(W * .615, H * .755, W * .13, H * .04, 2 * S); ctx.fillStyle = '#050607'; ctx.fill(); ctx.strokeStyle = '#5f666c'; ctx.lineWidth = .8 * S; ctx.stroke();
  ctx.fillStyle = '#ff8a3c'; ctx.font = font(8, true); ctx.textAlign = 'center';
  ctx.fillText(String(Math.round(cl(speed / 260, 0, 1) * 100)).padStart(3, '0') + '.' + String(Math.round(hp)).padStart(3, '0'), W * .68, H * .783);
  dial(W * .635, H * .855, rg, cl(hp / 100, 0, 1), 'HULL', 8);
  dial(W * .705, H * .855, rg, .5 + cl(pitch, -1, 1) * .4, 'VVI', 8);
  dial(W * .67, H * .955, rg * .9, cl(gunHeat / 100, 0, 1), 'GUN', 8);
  rivetLine(W * .61, H * .615, W * .74, H * .615, 6);

  // ---- throttle (left) and side-stick (right), moving with the controls
  {
    const tx = W * .075, ty = H * .93, th = cl(speed / 260, 0, 1);
    ctx.strokeStyle = '#0a0c0e'; ctx.lineWidth = 7 * S; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + 24 * S, ty - (14 + th * 24) * S); ctx.stroke();
    ctx.strokeStyle = '#59616a'; ctx.lineWidth = 4.5 * S;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + 24 * S, ty - (14 + th * 24) * S); ctx.stroke();
    const sx = W * .9, sy = H * .99, gx = sx + roll * 12 * S, gy = sy - 42 * S + pitch * 10 * S;
    ctx.strokeStyle = '#0a0c0e'; ctx.lineWidth = 8 * S; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(gx, gy); ctx.stroke();
    ctx.strokeStyle = '#2b3036'; ctx.lineWidth = 5.5 * S; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(gx, gy); ctx.stroke();
    ctx.lineCap = 'butt';
    rr(gx - 5 * S, gy - 14 * S, 10 * S, 17 * S, 3 * S); ctx.fillStyle = '#16191c'; ctx.fill(); ctx.strokeStyle = '#7c848a'; ctx.lineWidth = .8 * S; ctx.stroke();
    ctx.fillStyle = '#c33'; ctx.fillRect(gx - 1.5 * S, gy - 11 * S, 3 * S, 3 * S);
  }

  // ---- soft lighting: dim lower panel, faint green instrument glow
  ctx.fillStyle = grad(0, H * .6, 0, H, ['rgba(0,0,0,0)', 'rgba(0,0,0,.30)']); ctx.fillRect(0, H * .6, W, H * .4);
  const spill = ctx.createRadialGradient(CX, H * .8, 2, CX, H * .8, W * .28);
  spill.addColorStop(0, 'rgba(70,200,130,.05)'); spill.addColorStop(1, 'rgba(70,200,130,0)');
  ctx.fillStyle = spill; ctx.fillRect(W * .2, H * .6, W * .6, H * .4);
  ctx.restore();
  ctx.textAlign = 'left';
}

// ============================================================================
// 10. MAIN GAME LOOP
// ============================================================================
syncViewButtons();
syncSoundButton();
syncResolutionButton();
let last = performance.now();
function loop(t) {
  const rawFrameMs = Math.max(0, t - last);
  const dt = Math.min(.05, rawFrameMs / 1000);
  last = t;
  if (rawFrameMs > 0) frameTimeAverage += (rawFrameMs - frameTimeAverage) * .045;
  adaptiveTimer += dt;
  if (adaptiveTimer >= 2.4) {
    const oldScale = adaptiveScale;
    if (frameTimeAverage > 23.5) adaptiveScale = Math.max(.78, adaptiveScale - .045);
    else if (frameTimeAverage < 17.5) adaptiveScale = Math.min(1, adaptiveScale + .025);
    if (Math.abs(oldScale - adaptiveScale) > .001) size();
    adaptiveTimer = 0;
  }
  if (!document.hidden && innerHeight <= innerWidth) {
    if (!paused && state === 'play') {
      update(dt);
      updateProjectionCache();
      render();
    } else {
      // No 3D scene is visible behind the opaque menu; skip simulation and rendering work.
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
    }
  }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play' && !paused) openMenu('pause');
  last = performance.now();
});
requestAnimationFrame(loop);
</script>
